<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asignación de Mesas - Conciénciate</title>

    <style>
      :root {
        --azul: #12335f;
        --azul2: #2467a6;
        --coral: #e85d4f;
        --verde: #1f8a70;
        --oro: #f1b84b;
        --gris: #27313c;
        --blanco: rgba(255, 255, 255, 0.96);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        background:
          radial-gradient(circle at 12% 18%, rgba(241, 184, 75, 0.26), transparent 28%),
          radial-gradient(circle at 86% 22%, rgba(232, 93, 79, 0.18), transparent 30%),
          linear-gradient(135deg, #f7fbff 0%, #eef6f2 48%, #fff5ed 100%);

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: var(--azul);
        text-align: center;

        overflow: hidden;
        position: relative;
      }

      .imagen-fondo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        opacity: 0.18;
        filter: grayscale(1) contrast(1.18);
        z-index: -3;
        pointer-events: none;
        transform: scale(1.08) rotate(-6deg);
      }

      .wrap {
        width: min(1180px, 94vw);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        padding: clamp(22px, 3vw, 38px);
        border-radius: 8px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.72)
        );

        border: 1px solid rgba(18, 51, 95, 0.12);

        box-shadow:
          0 22px 65px rgba(18, 51, 95, 0.18),
          inset 0 0 0 1px rgba(255, 255, 255, 0.76);

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .scene {
        width: clamp(190px, 22vw, 270px);
        height: clamp(190px, 22vw, 270px);
        margin: 0 auto clamp(16px, 2vw, 24px);
        perspective: 1200px;
      }

      .dice {
        width: clamp(160px, 18vw, 220px);
        height: clamp(160px, 18vw, 220px);
        position: relative;
        margin: 20px auto;
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-38deg) rotateZ(2deg);
        transition: transform 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      .dice.rolling {
        animation: roll 0.55s linear infinite;
      }

      @keyframes roll {
        from {
          transform: rotateX(-24deg) rotateY(-38deg) rotateZ(0deg);
        }

        to {
          transform: rotateX(336deg) rotateY(682deg) rotateZ(360deg);
        }
      }

      .face {
        position: absolute;
        width: clamp(160px, 18vw, 220px);
        height: clamp(160px, 18vw, 220px);
        border-radius: 8px;

        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(220, 233, 255, 0.92)
        );

        border: 4px solid rgba(30, 60, 114, 0.14);

        box-shadow:
          inset 0 0 35px rgba(30, 60, 114, 0.1),
          0 14px 30px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(72px, 8vw, 104px);
        font-weight: 900;
        color: var(--azul);
      }

      .front {
        transform: rotateY(0deg) translateZ(clamp(80px, 9vw, 110px));
      }
      .back {
        transform: rotateY(180deg) translateZ(clamp(80px, 9vw, 110px));
      }
      .right {
        transform: rotateY(90deg) translateZ(clamp(80px, 9vw, 110px));
      }
      .left {
        transform: rotateY(-90deg) translateZ(clamp(80px, 9vw, 110px));
      }
      .top {
        transform: rotateX(90deg) translateZ(clamp(80px, 9vw, 110px));
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(clamp(80px, 9vw, 110px));
      }

      #mesa {
        font-size: clamp(46px, 7vw, 104px);
        font-weight: 900;
        letter-spacing: 1px;
        margin: 4px 0 8px;
        transition: transform 0.2s ease;

        text-shadow:
          0 4px 0 rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(255, 255, 255, 0.9);
      }

      #mesa.pop {
        transform: scale(1.06);
      }

      #mensaje {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: min(560px, 92vw);
        min-height: 1.8em;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: clamp(22px, 2.6vw, 38px);
        color: white;
        background: linear-gradient(135deg, var(--coral), var(--azul2));
        margin: 0 0 12px;
        font-weight: 900;
        min-height: 1.4em;

        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.24);
      }

      #fraseAudio {
        margin: 14px auto 16px;
        max-width: 900px;
        min-height: 2em;
        font-size: clamp(18px, 2vw, 30px);
        color: var(--gris);
        font-weight: 700;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.35s ease;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      #fraseAudio.show {
        opacity: 1;
        transform: translateY(0);
      }

      .meta {
        font-size: clamp(16px, 1.7vw, 22px);
        color: rgba(18, 51, 95, 0.82);
        margin-top: 14px;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      .btn {
        font-size: clamp(22px, 3vw, 42px);
        padding: 18px clamp(42px, 7vw, 76px);
        border: none;
        border-radius: 8px;

        background: linear-gradient(135deg, var(--azul), var(--verde));

        color: white;
        cursor: pointer;
        font-weight: 800;

        box-shadow: 0 16px 32px rgba(18, 51, 95, 0.24);

        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn.secondary {
        background: white;
        color: var(--azul);
        border: 2px solid rgba(30, 60, 114, 0.25);
        box-shadow: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 22px;
      }

      .overlay.show {
        display: flex;
      }

      .modal {
        width: min(760px, 92vw);
        background: white;
        border-radius: 8px;
        padding: 26px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .modal h2 {
        margin: 0 0 10px;
        font-size: clamp(26px, 3.4vw, 44px);
        color: var(--azul);
      }

      .modal p {
        margin: 0 0 18px;
        font-size: clamp(16px, 2.1vw, 24px);
        color: var(--gris);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .spark {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: rgba(30, 60, 114, 0.35);
        animation: fall 900ms ease-out forwards;
        pointer-events: none;
      }

      @keyframes fall {
        from {
          transform: translateY(-20px) rotate(0deg);
          opacity: 1;
        }

        to {
          transform: translateY(140px) rotate(180deg);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <img class="imagen-fondo" src="descarga.png" alt="Conciénciate" />

    <div class="wrap">
      <div class="card">
        <div class="scene">
          <div class="dice" id="dice">
            <div class="face front">1</div>
            <div class="face right">2</div>
            <div class="face back">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">★</div>
          </div>
        </div>

        <div id="mesa">PULSA PARA ASIGNAR MESA</div>

        <div id="mensaje"></div>

        <div id="fraseAudio"></div>

        <button class="btn" id="btn" onclick="tap()">ASIGNAR MESA</button>

        <div class="meta" id="restantes"></div>
      </div>
    </div>

    <audio id="audioSorteo" src="sorteo.mp3" preload="auto"></audio>
    <audio id="audioMesa" preload="auto"></audio>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>✅ Mesas asignadas</h2>

        <p>
          Ya han salido todas las mesas.<br />
          ¿Quieres reiniciar para empezar de nuevo?
        </p>

        <div class="actions">
          <button class="btn" onclick="reiniciarTodo()">REINICIAR</button>
          <button class="btn secondary" onclick="cerrarModal()">CERRAR</button>
        </div>
      </div>
    </div>

    <script>
      let mesas = [];
      let armado = false;
      let timerArmado = null;
      let mesaSonando = null;
      let ultimaCancion = "";
      let sesionAudio = 0;

      const dice = document.getElementById("dice");
      const mesaEl = document.getElementById("mesa");
      const msgEl = document.getElementById("mensaje");
      const fraseAudioEl = document.getElementById("fraseAudio");
      const restEl = document.getElementById("restantes");
      const btn = document.getElementById("btn");
      const overlay = document.getElementById("overlay");
      const audioSorteo = document.getElementById("audioSorteo");
      const audioMesa = document.getElementById("audioMesa");

      const estilosPorMesa = {
        1: {
          nombre: "rock",
          etiqueta: "Mesa del rock",
          color: "linear-gradient(135deg, #1f2937, #e85d4f)",
          canciones: [
            "rock/Bon Jovi - Livin' On A Prayer [lDK9QqIzhwk].mp3",
            "rock/AC_DC - Hells Bells (Official 4K Video) [etAIpkdhU9Q].mp3",
            "rock/Guns N' Roses - Sweet Child O' Mine (Official Music Video) [1w7OgIMMRc4].mp3",
            "rock/Metallica_ Nothing Else Matters (Official Music Video) [tAGnKpE4NCI].mp3",
          ],
        },
        2: {
          nombre: "indie",
          etiqueta: "Mesa del indie",
          color: "linear-gradient(135deg, #2467a6, #7c5cff)",
          canciones: [
            "indie/Leiva - Como Si Fueras a Morir Mañana [DMSTr9JOhBE].mp3",
            "indie/IZAL - Copacabana (Video Oficial) [Btvxvr64Nkg].mp3",
            "indie/Dani Fernández - Me has invitado a bailar (Videoclip Oficial) [ZjMGn4Kc7w0].mp3",
            "indie/Arde Bogotá - Exoplaneta (Audio) [HZgDUvxHvcw].mp3",
          ],
        },
        3: {
          nombre: "pop",
          etiqueta: "Mesa del pop",
          color: "linear-gradient(135deg, #e85d4f, #f1b84b)",
          canciones: [
            "pop/Robbie Williams - Angels [luwAMFcc2f8].mp3",
            "pop/Michael Jackson - Billie Jean (Official Video) [Zi_XLOBDo_Y].mp3",
            "pop/Coldplay - Fix You (Official Video) [k4V3Mo61fJM].mp3",
            "pop/The Weeknd - Blinding Lights (Official Video) [4NRXx6U8ABQ].mp3",
          ],
        },
        4: {
          nombre: "rumba",
          etiqueta: "Mesa de la rumba",
          color: "linear-gradient(135deg, #1f8a70, #f1b84b)",
          canciones: [
            "rumba/El barrio - Somos los barrieros [xz-ufjce1ow].mp3",
            "rumba/Los Delinqüentes - La primavera trompetera (Videoclip Oficial) [MfILTRB6h4I].mp3",
            "rumba/Gipsy Kings - Volare (Nel Blu di Pinto di Blu) (Official HD Video) [X8TOhb_4jU0].mp3",
            "rumba/Estopa - Como Camaron (Videoclip) [JmP89cIGJZM].mp3",
          ],
        },
        5: {
          nombre: "pop rock de los 80",
          etiqueta: "Mesa del pop rock de los 80",
          color: "linear-gradient(135deg, #12335f, #f1b84b)",
          canciones: [
            "Pop rock de los 80/Los Rodriguez - Sin Documentos (Videoclip oficial) [BUKHMGiW_rY].mp3",
            "Pop rock de los 80/Loquillo Y Los Trogloditas - Cadillac Solitario [vvitGvSA1EI].mp3",
            "Pop rock de los 80/El Sitio De Mi Recreo [ECVg698j3UI].mp3",
            "Pop rock de los 80/Antonio Flores - No Dudaria (Video TVE) [F_xbfIgWMHU].mp3",
          ],
        },
      };

      /*
        Frases dinámicas para acompañar cada asignación:
        Cada frase usa datos reales:
        {salida} = mesa que acaba de salir
        {quedan} = mesas que quedan
        {queda} = mesa que queda cuando solo queda una
        {primeraRestante} y {segundaRestante} = cuando quedan dos
      */

      const frasesPorEstado = {
        quedan4: [
          "La elegida es la mesa {salida}. El dado empieza fuerte.",
          "Mesa {salida}. Primera ronda con estilo.",
          "La mesa {salida} se adelanta. Las demás calientan.",
          "Mesa {salida}. El dado ya se ha venido arriba.",
          "Turno para la mesa {salida}. Quedan {quedan} en la pista.",
          "Mesa {salida}. Entrada triunfal y sin despeinarse.",
          "La mesa {salida} abre la noche. Bien jugado.",
          "Mesa {salida}. El dado ha hablado claro.",
        ],

        quedan3: [
          "Le toca a la mesa {salida}. Quedan {quedan}, ojo.",
          "Mesa {salida}. El dado tiene sus favoritos.",
          "La mesa {salida} avanza. Quedan {quedan}.",
          "Mesa {salida}. Suspense justo, hambre real.",
          "Turno para la mesa {salida}. Quedan {quedan} resistiendo.",
          "Mesa {salida}. El dado sigue mandando.",
          "La mesa {salida} pasa delante. Sin pedir permiso.",
          "Mesa {salida}. Esto se pone interesante.",
        ],

        quedan2: [
          "Le toca a la mesa {salida}. Quedan {primeraRestante} y {segundaRestante}.",
          "Mesa {salida}. Final apretado entre {primeraRestante} y {segundaRestante}.",
          "La mesa {salida} se adelanta. Quedan dos finalistas.",
          "Mesa {salida}. Ahora viene el cara o cruz.",
          "Turno para la mesa {salida}. {primeraRestante} y {segundaRestante} siguen vivas.",
          "Mesa {salida}. El final ya huele a cena.",
          "La mesa {salida} pasa. Quedan {primeraRestante} y {segundaRestante}.",
          "Mesa {salida}. Esto ya es final de torneo.",
        ],

        queda1: [
          "La elegida es la mesa {salida}. Solo queda la {queda}.",
          "Mesa {salida}. La {queda} cierra la fiesta.",
          "La mesa {salida} entra. La {queda} guarda el final.",
          "Mesa {salida}. Queda la {queda}, con suspense.",
          "Turno para la mesa {salida}. La {queda} va de estrella final.",
          "Mesa {salida}. Última pendiente: la {queda}.",
          "La mesa {salida} pasa. La {queda} respira hondo.",
          "Mesa {salida}. La {queda} se queda para el cierre.",
        ],

        final: [
          "Última mesa: la {salida}. Cierre con estilo.",
          "Mesa {salida}. Se acabó el suspense.",
          "Cierra la mesa {salida}. El dado descansa.",
          "Mesa {salida}. Llegó tarde, llegó elegante.",
          "Última asignada: mesa {salida}. Ahora sí.",
          "Mesa {salida}. Final digno de aplauso.",
          "Y la última es la {salida}. Buen cierre.",
          "Mesa {salida}. Se acabó el show.",
        ],
      };

      const posicionesDado = {
        1: "rotateX(-8deg) rotateY(0deg)",
        2: "rotateX(-8deg) rotateY(-90deg)",
        3: "rotateX(-8deg) rotateY(180deg)",
        4: "rotateX(-8deg) rotateY(90deg)",
        5: "rotateX(-98deg) rotateY(0deg)",
      };

      function reiniciar() {
        mesas = [];

        for (let i = 1; i <= 5; i++) {
          mesas.push(i);
        }

        actualizarRestantes();
        desarmar();

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");
        msgEl.removeAttribute("style");
        detenerMusicaMesa();

        dice.classList.remove("rolling");

        dice.style.transform = "rotateX(-24deg) rotateY(-38deg) rotateZ(2deg)";
      }

      function actualizarRestantes() {
        restEl.textContent = `Mesas restantes: ${mesas.length}/5`;
      }

      function cerrarModal() {
        overlay.classList.remove("show");
      }

      function reiniciarTodo() {
        cerrarModal();

        reiniciar();

        mesaEl.textContent = "PULSA PARA ASIGNAR MESA";

        msgEl.textContent = "";
      }

      function elegirAleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      function limpiarNombreCancion(ruta) {
        const archivo = decodeURIComponent(ruta.split("/").pop() || ruta);

        return archivo
          .replace(/\.mp3$/i, "")
          .replace(/\s*\[[^\]]+\]\s*$/g, "")
          .replace(/\s*\([^)]*(Official|Video|Videoclip|Audio|Remasterizado|HD|4K)[^)]*\)\s*/gi, " ")
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function detenerMusicaMesa() {
        sesionAudio++;
        window.speechSynthesis?.cancel();
        mesaSonando = null;
        ultimaCancion = "";
        audioMesa.pause();
        audioMesa.removeAttribute("src");
        audioMesa.load();
      }

      function detenerSorteo() {
        audioSorteo.pause();
        audioSorteo.currentTime = 0;
      }

      function prepararMusicaMesa(numeroMesa) {
        const estilo = estilosPorMesa[numeroMesa];

        if (!estilo) return null;

        let cancionesDisponibles = estilo.canciones;

        if (estilo.canciones.length > 1) {
          cancionesDisponibles = estilo.canciones.filter(
            (cancion) => cancion !== ultimaCancion,
          );
        }

        const cancion = elegirAleatorio(cancionesDisponibles);
        ultimaCancion = cancion;

        return {
          ruta: cancion,
          titulo: limpiarNombreCancion(cancion),
        };
      }

      function reproducirCancion(cancion, sesion) {
        if (!cancion) return;
        if (sesion && sesion !== sesionAudio) return;

        detenerSorteo();
        audioMesa.pause();
        audioMesa.src = encodeURI(cancion.ruta);
        audioMesa.currentTime = 0;
        audioMesa.volume = 0.72;
        audioMesa.play().catch(() => {
          fraseAudioEl.textContent =
            "Pulsa de nuevo si el navegador necesita activar el sonido.";
          fraseAudioEl.classList.add("show");
        });
      }

      function reproducirSiguienteCancionMesa() {
        if (!mesaSonando) return;

        const cancion = prepararMusicaMesa(mesaSonando);

        reproducirCancion(cancion, sesionAudio);
      }

      function obtenerVozEspanol() {
        const voces = window.speechSynthesis?.getVoices?.() || [];

        return (
          voces.find((voz) => voz.lang?.toLowerCase().startsWith("es-es")) ||
          voces.find((voz) => voz.lang?.toLowerCase().startsWith("es")) ||
          voces[0]
        );
      }

      function narrarAntesDeMusica(texto, cancion, sesion) {
        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
          reproducirCancion(cancion, sesion);
          return;
        }

        window.speechSynthesis.cancel();

        const voz = new SpeechSynthesisUtterance(texto);

        voz.lang = "es-ES";
        voz.rate = 0.96;
        voz.pitch = 1.02;
        voz.volume = 1;

        const vozEspanol = obtenerVozEspanol();

        if (vozEspanol) {
          voz.voice = vozEspanol;
        }

        voz.onend = () => reproducirCancion(cancion, sesion);
        voz.onerror = () => reproducirCancion(cancion, sesion);

        window.speechSynthesis.speak(voz);
      }

      function formatearListaMesas(lista) {
        if (lista.length === 0) return "";
        if (lista.length === 1) return lista[0].toString();
        if (lista.length === 2) return lista[0] + " y " + lista[1];

        return lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1];
      }

      function obtenerFraseDinamica(numeroMesaQueSale) {
        const restantes = [...mesas].sort((a, b) => a - b);

        let bloque = null;

        if (restantes.length === 4) {
          bloque = frasesPorEstado.quedan4;
        } else if (restantes.length === 3) {
          bloque = frasesPorEstado.quedan3;
        } else if (restantes.length === 2) {
          bloque = frasesPorEstado.quedan2;
        } else if (restantes.length === 1) {
          bloque = frasesPorEstado.queda1;
        } else {
          bloque = frasesPorEstado.final;
        }

        let frase = elegirAleatorio(bloque);

        frase = frase
          .replaceAll("{salida}", numeroMesaQueSale)
          .replaceAll("{quedan}", formatearListaMesas(restantes))
          .replaceAll("{queda}", restantes[0] ?? "")
          .replaceAll("{primeraRestante}", restantes[0] ?? "")
          .replaceAll("{segundaRestante}", restantes[1] ?? "");

        return frase;
      }

      function mostrarFrase(fraseCompleta) {
        fraseAudioEl.classList.remove("show");

        setTimeout(() => {
          fraseAudioEl.textContent = fraseCompleta;

          fraseAudioEl.classList.add("show");
        }, 80);
      }

      function confetiSuave() {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("div");

          s.className = "spark";

          const x = window.innerWidth / 2 + (Math.random() * 320 - 160);

          const y = window.innerHeight / 2 + (Math.random() * 80 - 40);

          s.style.left = x + "px";
          s.style.top = y + "px";

          document.body.appendChild(s);

          setTimeout(() => s.remove(), 900);
        }
      }

      function animarTexto() {
        mesaEl.classList.remove("pop");

        void mesaEl.offsetWidth;

        mesaEl.classList.add("pop");

        confetiSuave();
      }

      function armar() {
        armado = true;

        btn.textContent = "CONFIRMAR";

        msgEl.textContent = "Pulsa otra vez para confirmar la mesa.";

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");
        detenerMusicaMesa();
        window.speechSynthesis?.cancel();

        dice.classList.add("rolling");
        audioSorteo.currentTime = 0;
        audioSorteo.volume = 0.45;
        audioSorteo.play().catch(() => {});

        clearTimeout(timerArmado);

        timerArmado = setTimeout(desarmar, 3000);
      }

      function desarmar() {
        armado = false;

        btn.textContent = "ASIGNAR MESA";

        clearTimeout(timerArmado);

        timerArmado = null;

        if (mesas.length > 0) {
          dice.classList.remove("rolling");
        }
      }

      function sacarMesaConfirmada() {
        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        sesionAudio++;
        detenerSorteo();
        audioMesa.pause();
        window.speechSynthesis?.cancel();

        const index = Math.floor(Math.random() * mesas.length);

        const numero = mesas[index];

        mesas.splice(index, 1);

        dice.classList.remove("rolling");

        setTimeout(() => {
          dice.style.transform =
            posicionesDado[numero] +
            " rotateZ(" +
            Math.floor(Math.random() * 4) * 360 +
            "deg)";
        }, 40);

        setTimeout(() => {
          const estilo = estilosPorMesa[numero];
          mesaSonando = numero;
          ultimaCancion = "";
          const sesionMesa = sesionAudio;
          const cancion = prepararMusicaMesa(numero);
          const frase = obtenerFraseDinamica(numero);
          const fraseCompleta = cancion
            ? `${frase} Ahora suena: ${cancion.titulo}.`
            : frase;

          mesaEl.textContent = "MESA " + numero;

          msgEl.textContent = estilo
            ? estilo.etiqueta.toUpperCase()
            : "MESA ASIGNADA";
          msgEl.style.background = estilo?.color || "";

          mostrarFrase(fraseCompleta);
          narrarAntesDeMusica(fraseCompleta, cancion, sesionMesa);

          actualizarRestantes();

          animarTexto();
        }, 1250);
      }

      function tap() {
        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        if (!armado) {
          armar();
          return;
        }

        desarmar();

        sacarMesaConfirmada();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
        }
      });

      audioMesa.addEventListener("ended", reproducirSiguienteCancionMesa);

      reiniciar();
    </script>
  </body>
</html>
