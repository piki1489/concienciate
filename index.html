<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asignación de Mesas - Conciénciate</title>

    <style>
      :root {
        --azul: #12335f;
        --azul2: #2467a6;
        --coral: #e85d4f;
        --verde: #1f8a70;
        --oro: #f1b84b;
        --gris: #27313c;
        --blanco: rgba(255, 255, 255, 0.96);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        padding: clamp(8px, 1.4vh, 16px) 0;
        background:
          radial-gradient(
            circle at 12% 18%,
            rgba(241, 184, 75, 0.26),
            transparent 28%
          ),
          radial-gradient(
            circle at 86% 22%,
            rgba(232, 93, 79, 0.18),
            transparent 30%
          ),
          linear-gradient(135deg, #f7fbff 0%, #eef6f2 48%, #fff5ed 100%);

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: var(--azul);
        text-align: center;

        overflow: hidden;
        position: relative;
      }

      .imagen-fondo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        opacity: 0.18;
        filter: grayscale(1) contrast(1.18);
        z-index: -3;
        pointer-events: none;
        transform: scale(1.08) rotate(-6deg);
      }

      .wrap {
        width: min(1180px, 94vw);
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        max-height: calc(100vh - 16px);
        padding: clamp(14px, 2.2vw, 30px);
        border-radius: 8px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.72)
        );

        border: 1px solid rgba(18, 51, 95, 0.12);

        box-shadow:
          0 22px 65px rgba(18, 51, 95, 0.18),
          inset 0 0 0 1px rgba(255, 255, 255, 0.76);

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .scene {
        width: clamp(150px, 18vh, 230px);
        height: clamp(150px, 18vh, 230px);
        margin: 0 auto clamp(8px, 1.5vh, 16px);
        perspective: 1200px;
      }

      .dice {
        width: clamp(130px, 15.5vh, 190px);
        height: clamp(130px, 15.5vh, 190px);
        position: relative;
        margin: 20px auto;
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-38deg) rotateZ(2deg);
        transition: transform 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      .dice.rolling {
        animation: roll 0.55s linear infinite;
      }

      @keyframes roll {
        from {
          transform: rotateX(-24deg) rotateY(-38deg) rotateZ(0deg);
        }

        to {
          transform: rotateX(336deg) rotateY(682deg) rotateZ(360deg);
        }
      }

      .face {
        position: absolute;
        width: clamp(130px, 15.5vh, 190px);
        height: clamp(130px, 15.5vh, 190px);
        border-radius: 8px;

        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(220, 233, 255, 0.92)
        );

        border: 4px solid rgba(30, 60, 114, 0.14);

        box-shadow:
          inset 0 0 35px rgba(30, 60, 114, 0.1),
          0 14px 30px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(60px, 7vh, 88px);
        font-weight: 900;
        color: var(--azul);
      }

      .front {
        transform: rotateY(0deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .back {
        transform: rotateY(180deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .right {
        transform: rotateY(90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .left {
        transform: rotateY(-90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .top {
        transform: rotateX(90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }

      #mesa {
        font-size: clamp(40px, 8vh, 92px);
        font-weight: 900;
        letter-spacing: 1px;
        margin: 4px 0 8px;
        transition: transform 0.2s ease;

        text-shadow:
          0 4px 0 rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(255, 255, 255, 0.9);
      }

      #mesa.pop {
        transform: scale(1.06);
      }

      #mensaje {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: min(560px, 92vw);
        min-height: 1.8em;
        padding: 7px 18px;
        border-radius: 8px;
        font-size: clamp(20px, 3.2vh, 34px);
        color: white;
        background: linear-gradient(135deg, var(--coral), var(--azul2));
        margin: 0 0 12px;
        font-weight: 900;
        min-height: 1.4em;

        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.24);
      }

      #cuentaAtras {
        height: 0;
        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          height 0.18s ease;
        color: var(--coral);
        font-size: clamp(56px, 10vh, 120px);
        font-weight: 900;
        line-height: 0.95;
        text-shadow:
          0 5px 0 rgba(255, 255, 255, 0.95),
          0 16px 32px rgba(18, 51, 95, 0.2);
      }

      #cuentaAtras.show {
        height: clamp(54px, 10vh, 116px);
        opacity: 1;
        transform: scale(1);
      }

      #cuentaAtras.pop {
        animation: countdown-pop 0.28s ease;
      }

      @keyframes countdown-pop {
        0% {
          transform: scale(0.72);
        }

        70% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      #fraseAudio {
        margin: clamp(8px, 1.4vh, 12px) auto clamp(8px, 1.4vh, 12px);
        width: min(900px, 92vw);
        min-height: 2.4em;
        font-size: clamp(17px, 2.6vh, 26px);
        color: var(--gris);
        font-weight: 700;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.35s ease;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      #fraseAudio.show {
        opacity: 1;
        transform: translateY(0);
      }

      .frase-linea {
        display: block;
      }

      .player {
        width: min(780px, 92vw);
        margin: clamp(8px, 1.4vh, 12px) auto clamp(10px, 1.6vh, 14px);
        padding: 10px 14px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.92),
          rgba(237, 246, 255, 0.86)
        );
        border: 1px solid rgba(18, 51, 95, 0.14);
        box-shadow: 0 12px 28px rgba(18, 51, 95, 0.12);
        display: none;
        grid-template-columns: 1fr;
        grid-template-areas:
          "info"
          "controls"
          "progress";
        gap: 7px;
        align-items: center;
      }

      .player.show {
        display: grid;
      }

      .player-controls {
        grid-area: controls;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .player-btn {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 8px;
        background: var(--azul);
        color: white;
        font-size: 24px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(18, 51, 95, 0.18);
        transition:
          transform 0.18s ease,
          background 0.18s ease,
          opacity 0.18s ease;
      }

      .player-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        background: var(--verde);
      }

      .player-btn:disabled {
        cursor: default;
        opacity: 0.36;
      }

      .player-main {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--coral), var(--azul2));
        font-size: 30px;
      }

      .player-info {
        grid-area: info;
        min-width: 0;
        text-align: center;
        color: var(--gris);
        font-weight: 800;
      }

      .player-kicker {
        display: block;
        color: rgba(18, 51, 95, 0.7);
        font-size: 13px;
        text-transform: uppercase;
      }

      .player-title {
        display: block;
        margin-top: 3px;
        font-size: clamp(16px, 2vh, 20px);
        line-height: 1.18;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-progress {
        grid-area: progress;
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) 52px;
        gap: 8px;
        align-items: center;
        color: rgba(18, 51, 95, 0.78);
        font-size: 13px;
        font-weight: 900;
      }

      .time-label {
        font-variant-numeric: tabular-nums;
      }

      .range {
        width: 100%;
        accent-color: var(--coral);
        cursor: pointer;
      }

      .meta {
        font-size: clamp(16px, 1.7vw, 22px);
        color: rgba(18, 51, 95, 0.82);
        margin-top: clamp(8px, 1.2vh, 12px);

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      .btn {
        font-size: clamp(20px, 3.4vh, 38px);
        padding: clamp(12px, 2vh, 18px) clamp(38px, 7vw, 76px);
        border: none;
        border-radius: 8px;

        background: linear-gradient(135deg, var(--azul), var(--verde));

        color: white;
        cursor: pointer;
        font-weight: 800;

        box-shadow: 0 16px 32px rgba(18, 51, 95, 0.24);

        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn:disabled {
        cursor: default;
        opacity: 0.86;
        transform: none;
      }

      .btn.secondary {
        background: white;
        color: var(--azul);
        border: 2px solid rgba(30, 60, 114, 0.25);
        box-shadow: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 22px;
      }

      .overlay.show {
        display: flex;
      }

      .modal {
        width: min(760px, 92vw);
        background: white;
        border-radius: 8px;
        padding: 26px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .modal h2 {
        margin: 0 0 10px;
        font-size: clamp(26px, 3.4vw, 44px);
        color: var(--azul);
      }

      .modal p {
        margin: 0 0 18px;
        font-size: clamp(16px, 2.1vw, 24px);
        color: var(--gris);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .spark {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: rgba(30, 60, 114, 0.35);
        animation: fall 900ms ease-out forwards;
        pointer-events: none;
      }

      @keyframes fall {
        from {
          transform: translateY(-20px) rotate(0deg);
          opacity: 1;
        }

        to {
          transform: translateY(140px) rotate(180deg);
          opacity: 0;
        }
      }

      @media (max-height: 760px) {
        .card {
          padding: 10px 20px;
        }

        .scene {
          width: 132px;
          height: 132px;
          margin-bottom: 6px;
        }

        .dice,
        .face {
          width: 112px;
          height: 112px;
        }

        .face {
          font-size: 52px;
        }

        .front {
          transform: rotateY(0deg) translateZ(56px);
        }
        .back {
          transform: rotateY(180deg) translateZ(56px);
        }
        .right {
          transform: rotateY(90deg) translateZ(56px);
        }
        .left {
          transform: rotateY(-90deg) translateZ(56px);
        }
        .top {
          transform: rotateX(90deg) translateZ(56px);
        }
        .bottom {
          transform: rotateX(-90deg) translateZ(56px);
        }

        #mesa {
          font-size: 54px;
          margin-bottom: 4px;
        }

        #mensaje {
          font-size: 24px;
        }

        #fraseAudio {
          font-size: 18px;
          min-height: 2em;
        }

        .meta {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .player {
          grid-template-columns: 1fr;
          grid-template-areas:
            "info"
            "controls"
            "progress";
        }

        .player-info {
          text-align: center;
        }

        .player-progress {
          grid-template-columns: 44px minmax(0, 1fr) 44px;
        }
      }
    </style>
  </head>

  <body>
    <img class="imagen-fondo" src="descarga.png" alt="Conciénciate" />

    <div class="wrap">
      <div class="card">
        <div class="scene">
          <div class="dice" id="dice">
            <div class="face front">1</div>
            <div class="face right">2</div>
            <div class="face back">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">★</div>
          </div>
        </div>

        <div id="mesa">PULSA PARA ASIGNAR MESA</div>

        <div id="mensaje"></div>

        <div id="cuentaAtras" aria-live="polite"></div>

        <div id="fraseAudio"></div>

        <div class="player" id="player">
          <div class="player-info">
            <span class="player-kicker" id="playerKicker">Playlist</span>
            <span class="player-title" id="playerTitle"
              >Sin musica todavia</span
            >
          </div>
          <div class="player-controls">
            <button
              class="player-btn"
              id="prevBtn"
              type="button"
              onclick="cancionAnterior()"
              title="Cancion anterior"
            >
              ‹
            </button>
            <button
              class="player-btn player-main"
              id="playBtn"
              type="button"
              onclick="alternarPlay()"
              title="Play/Pausa"
            >
              ▶
            </button>
            <button
              class="player-btn"
              id="nextBtn"
              type="button"
              onclick="cancionSiguienteManual()"
              title="Siguiente cancion"
            >
              ›
            </button>
          </div>
          <div class="player-progress">
            <span class="time-label" id="currentTime">0:00</span>
            <input
              class="range"
              id="progressRange"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Progreso de la cancion"
            />
            <span class="time-label" id="durationTime">0:00</span>
          </div>
        </div>

        <button class="btn" id="btn" onclick="tap()">ASIGNAR MESA</button>

        <div class="meta" id="restantes"></div>
      </div>
    </div>

    <audio id="audioSorteo" src="sorteo.mp3" preload="auto"></audio>
    <audio id="audioMesa" preload="auto"></audio>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>✅ Mesas asignadas</h2>

        <p>
          Ya han salido todas las mesas.<br />
          ¿Quieres reiniciar para empezar de nuevo?
        </p>

        <div class="actions">
          <button class="btn" onclick="reiniciarTodo()">REINICIAR</button>
          <button class="btn secondary" onclick="cerrarModal()">CERRAR</button>
        </div>
      </div>
    </div>

      /*

          "Turno para la mesa {salida}. La {queda} va de estrella final.",
          "Mesa {salida}. Última pendiente: la {queda}.",
          "La mesa {salida} pasa. La {queda} respira hondo.",
          "Mesa {salida}. La {queda} se queda para el cierre.",
        ],

        final: [
          "Última mesa: la {salida}. Cierre con estilo.",
          "Mesa {salida}. Se acabó el suspense.",
          "Cierra la mesa {salida}. El dado descansa.",
          "Mesa {salida}. Llegó tarde, llegó elegante.",
          "Última asignada: mesa {salida}. Ahora sí.",
          "Mesa {salida}. Final digno de aplauso.",
          "Y la última es la {salida}. Buen cierre.",
          "Mesa {salida}. Se acabó el show.",
        ],
      };

      const posicionesDado = {
        1: "rotateX(-8deg) rotateY(0deg)",
        2: "rotateX(-8deg) rotateY(-90deg)",
        3: "rotateX(-8deg) rotateY(180deg)",
        4: "rotateX(-8deg) rotateY(90deg)",
        5: "rotateX(-98deg) rotateY(0deg)",
      };

      function reiniciar() {
        mesas = [];

        for (let i = 1; i <= 5; i++) {
          mesas.push(i);
        }

        actualizarRestantes();
        desbloquearBotonAsignar();

        cuentaEl.textContent = "";
        cuentaEl.classList.remove("show", "pop");
        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");
        msgEl.removeAttribute("style");
        detenerMusicaMesa();
        ocultarPlayer();

        dice.classList.remove("rolling");

        dice.style.transform = "rotateX(-24deg) rotateY(-38deg) rotateZ(2deg)";
      }

      function actualizarRestantes() {
        restEl.textContent = `Mesas restantes: ${mesas.length}/5`;
      }

      function cerrarModal() {
        overlay.classList.remove("show");
      }

      function reiniciarTodo() {
        cerrarModal();

        reiniciar();

        mesaEl.textContent = "PULSA PARA ASIGNAR MESA";

        msgEl.textContent = "";
      }

      function elegirAleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      function limpiarNombreCancion(ruta) {
        const archivo = decodeURIComponent(ruta.split("/").pop() || ruta);

        return archivo
          .replace(/\.mp3$/i, "")
          .replace(/\s*\[[^\]]+\]\s*$/g, "")
          .replace(
            /\s*\([^)]*(Official|Video|Videoclip|Audio|Remasterizado|HD|4K)[^)]*\)\s*/gi,
            " ",
          )
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function formatearTiempo(segundos) {
        if (!Number.isFinite(segundos)) return "0:00";

        const minutos = Math.floor(segundos / 60);
        const resto = Math.floor(segundos % 60)
          .toString()
          .padStart(2, "0");

        return `${minutos}:${resto}`;
      }

      function actualizarProgreso() {
        const duracion = audioMesa.duration || 0;
        const actual = audioMesa.currentTime || 0;
        const porcentaje = duracion ? (actual / duracion) * 100 : 0;

        progressRange.value = porcentaje;
        currentTimeEl.textContent = formatearTiempo(actual);
        durationTimeEl.textContent = formatearTiempo(duracion);
      }

      function resetearProgreso() {
        progressRange.value = 0;
        currentTimeEl.textContent = "0:00";
        durationTimeEl.textContent = "0:00";
      }

      function detenerMusicaMesa() {
        sesionAudio++;
        mesaSonando = null;
        ultimaCancion = "";
        indiceCancionMesa = 0;
        fraseMesaActual = "";
        audioMesa.pause();
        audioMesa.removeAttribute("src");
        audioMesa.load();
        resetearProgreso();
        ocultarPlayer();
      }

      function detenerSorteo() {
        audioSorteo.pause();
        audioSorteo.currentTime = 0;
      }

      function desbloquearAudio() {
        if (audioDesbloqueado) return;

        audioDesbloqueado = true;
        audioSorteo.volume = 0.08;

        const intento = audioSorteo.play();

        if (intento?.then) {
          intento
            .then(() => {
              setTimeout(() => {
                audioSorteo.pause();
                audioSorteo.currentTime = 0;
                audioSorteo.volume = 0.45;
              }, 120);
            })
            .catch(() => {
              audioDesbloqueado = false;
            });
        }
      }

      function prepararMusicaMesa(numeroMesa) {
        const estilo = estilosPorMesa[numeroMesa];

        if (!estilo) return null;
        if (!estilo.canciones.length) return null;

        const indiceSeguro = Math.max(
          0,
          Math.min(indiceCancionMesa, estilo.canciones.length - 1),
        );
        const cancion = estilo.canciones[indiceSeguro];
        indiceCancionMesa = indiceSeguro;
        ultimaCancion = cancion;

        return {
          ruta: cancion,
          titulo: limpiarNombreCancion(cancion),
          indice: indiceSeguro,
          total: estilo.canciones.length,
        };
      }

      function actualizarPlayer(cancion = null) {
        const estilo = estilosPorMesa[mesaSonando];
        const total = estilo?.canciones.length || 0;

        if (!mesaSonando || !cancion || !total) {
          ocultarPlayer();
          return;
        }

        player.classList.add("show");
        playerKicker.textContent = `Cancion ${indiceCancionMesa + 1} de ${total}`;
        playerTitle.textContent = cancion.titulo;
        prevBtn.disabled = indiceCancionMesa === 0;
        nextBtn.disabled = indiceCancionMesa >= total - 1;
        playBtn.textContent = audioMesa.paused ? "▶" : "❚❚";
      }

      function ocultarPlayer() {
        player.classList.remove("show");
        playerTitle.textContent = "Sin musica todavia";
        playerKicker.textContent = "Playlist";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        playBtn.textContent = "▶";
      }

      function reproducirCancion(cancion, sesion) {
        if (!cancion) return;
        if (sesion && sesion !== sesionAudio) return;

        detenerSorteo();
        audioMesa.pause();
        audioMesa.src = encodeURI(cancion.ruta);
        audioMesa.currentTime = 0;
        audioMesa.volume = 1;
        resetearProgreso();
        audioMesa
          .play()
          .then(() => {
            mostrarCancionActual(cancion);
            actualizarPlayer(cancion);
          })
          .catch(() => {
            fraseAudioEl.textContent =
              "La tele ha bloqueado el sonido. Pulsa ASIGNAR MESA otra vez para activarlo.";
            fraseAudioEl.classList.add("show");
            audioDesbloqueado = false;
          });
      }

      function reproducirSiguienteCancionMesa() {
        if (!mesaSonando) return;

        const estilo = estilosPorMesa[mesaSonando];

        if (!estilo || indiceCancionMesa >= estilo.canciones.length - 1) {
          playBtn.textContent = "▶";
          nextBtn.disabled = true;
          playerKicker.textContent = "Playlist terminada";
          return;
        }

        indiceCancionMesa++;
        const cancion = prepararMusicaMesa(mesaSonando);

        reproducirCancion(cancion, sesionAudio);
      }

      function cancionSiguienteManual() {
        reproducirSiguienteCancionMesa();
      }

      function cancionAnterior() {
        if (!mesaSonando) return;

        if (audioMesa.currentTime > 3) {
          audioMesa.currentTime = 0;
          actualizarProgreso();
          return;
        }

        if (indiceCancionMesa === 0) return;

        indiceCancionMesa--;
        const cancion = prepararMusicaMesa(mesaSonando);

        reproducirCancion(cancion, sesionAudio);
      }

      function alternarPlay() {
        if (!mesaSonando || !audioMesa.src) return;

        if (audioMesa.paused) {
          audioMesa
            .play()
            .then(() => {
              playBtn.textContent = "❚❚";
            })
            .catch(() => {});
        } else {
          audioMesa.pause();
          playBtn.textContent = "▶";
        }
      }

      function formatearListaMesas(lista) {
        if (lista.length === 0) return "";
        if (lista.length === 1) return lista[0].toString();
        if (lista.length === 2) return lista[0] + " y " + lista[1];

        return lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1];
      }

      function obtenerFraseDinamica(numeroMesaQueSale) {
        const restantes = [...mesas].sort((a, b) => a - b);

        let bloque = null;

        if (restantes.length === 4) {
          bloque = frasesPorEstado.quedan4;
        } else if (restantes.length === 3) {
          bloque = frasesPorEstado.quedan3;
        } else if (restantes.length === 2) {
          bloque = frasesPorEstado.quedan2;
        } else if (restantes.length === 1) {
          bloque = frasesPorEstado.queda1;
        } else {
          bloque = frasesPorEstado.final;
        }

        let frase = elegirAleatorio(bloque);

        frase = frase
          .replaceAll("{salida}", numeroMesaQueSale)
          .replaceAll("{quedan}", formatearListaMesas(restantes))
          .replaceAll("{queda}", restantes[0] ?? "")
          .replaceAll("{primeraRestante}", restantes[0] ?? "")
          .replaceAll("{segundaRestante}", restantes[1] ?? "");

        return frase;
      }

      function escaparHtml(texto) {
        return texto.replace(/[&<>"']/g, (caracter) => {
          const entidades = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return entidades[caracter];
        });
      }

      function mostrarTexto(texto, cancion = null) {
        fraseAudioEl.classList.remove("show");

        setTimeout(() => {
          if (cancion) {
            const frase = escaparHtml(texto);

            fraseAudioEl.innerHTML = `
              <span class="frase-linea">${frase}</span>
            `;
          } else {
            fraseAudioEl.textContent = texto;
          }

          fraseAudioEl.classList.add("show");
        }, 80);
      }

      function mostrarCancionActual(cancion) {
        mostrarTexto(fraseMesaActual, cancion);
      }

      function confetiSuave() {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("div");

          s.className = "spark";

          const x = window.innerWidth / 2 + (Math.random() * 320 - 160);

          const y = window.innerHeight / 2 + (Math.random() * 80 - 40);

          s.style.left = x + "px";
          s.style.top = y + "px";

          document.body.appendChild(s);

          setTimeout(() => s.remove(), 900);
        }
      }

      function animarTexto() {
        mesaEl.classList.remove("pop");

        void mesaEl.offsetWidth;

        mesaEl.classList.add("pop");

        confetiSuave();
      }

      function bloquearBotonAsignar() {
        asignandoMesa = true;
        btn.disabled = true;
        btn.textContent = "ASIGNANDO...";
      }

      function desbloquearBotonAsignar() {
        asignandoMesa = false;
        btn.disabled = false;
        btn.textContent = "ASIGNAR MESA";
        clearTimeout(cuentaTimer);
        cuentaTimer = null;
      }

      function mostrarCuentaAtras(valor) {
        cuentaEl.textContent = valor;
        cuentaEl.classList.add("show");
        cuentaEl.classList.remove("pop");

        void cuentaEl.offsetWidth;

        cuentaEl.classList.add("pop");
      }

      function iniciarAsignacionMesa() {
        if (asignandoMesa) return;

        bloquearBotonAsignar();

        msgEl.textContent = "Asignando mesa...";
        msgEl.removeAttribute("style");

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");
        detenerMusicaMesa();

        dice.classList.add("rolling");
        audioSorteo.currentTime = 0;
        audioSorteo.volume = 0.45;
        audioSorteo.play().catch(() => {});

        const pasos = ["3", "2", "1", "🎲"];
        let indicePaso = 0;

        mostrarCuentaAtras(pasos[indicePaso]);

        function siguientePaso() {
          indicePaso++;

          if (indicePaso < pasos.length) {
            mostrarCuentaAtras(pasos[indicePaso]);
            cuentaTimer = setTimeout(siguientePaso, 650);
            return;
          }

          cuentaEl.classList.remove("show", "pop");
          cuentaEl.textContent = "";

          sacarMesaConfirmada();
        }

        cuentaTimer = setTimeout(siguientePaso, 650);
      }

      function sacarMesaConfirmada() {
        if (mesas.length === 0) {
          desbloquearBotonAsignar();
          overlay.classList.add("show");
          return;
        }

        sesionAudio++;
        detenerSorteo();
        audioMesa.pause();

        const index = Math.floor(Math.random() * mesas.length);

        const numero = mesas[index];

        mesas.splice(index, 1);

        dice.classList.remove("rolling");

        setTimeout(() => {
          dice.style.transform =
            posicionesDado[numero] +
            " rotateZ(" +
            Math.floor(Math.random() * 4) * 360 +
            "deg)";
        }, 40);

        setTimeout(() => {
          const estilo = estilosPorMesa[numero];
          mesaSonando = numero;
          ultimaCancion = "";
          indiceCancionMesa = 0;
          const sesionMesa = sesionAudio;
          const cancion = prepararMusicaMesa(numero);
          const frase = obtenerFraseDinamica(numero);
          fraseMesaActual = frase;

          mesaEl.textContent = "MESA " + numero;

          msgEl.textContent = estilo
            ? estilo.etiqueta.toUpperCase()
            : "MESA ASIGNADA";
          msgEl.style.background = estilo?.color || "";

          mostrarTexto(fraseMesaActual, cancion);
          reproducirCancion(cancion, sesionMesa);

          actualizarRestantes();

          animarTexto();

          desbloquearBotonAsignar();
        }, 1250);
      }

      function tap() {
        window.scrollTo(0, 0);
        desbloquearAudio();

        if (asignandoMesa) return;

        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        iniciarAsignacionMesa();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
        }
      });

      audioMesa.addEventListener("ended", reproducirSiguienteCancionMesa);
      audioMesa.addEventListener("loadedmetadata", actualizarProgreso);
      audioMesa.addEventListener("timeupdate", actualizarProgreso);
      audioMesa.addEventListener("play", () => {
        playBtn.textContent = "❚❚";
      });
      audioMesa.addEventListener("pause", () => {
        playBtn.textContent = "▶";
      });
      progressRange.addEventListener("input", () => {
        if (!audioMesa.duration) return;

        audioMesa.currentTime =
          (Number(progressRange.value) / 100) * audioMesa.duration;
        actualizarProgreso();
      });

      reiniciar();
    </script>
  </body>
</html>
