<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asignación de Mesas - Conciénciate</title>

    <style>
      :root {
        --azul: #1e3c72;
        --azul2: #2a5298;
        --gris: #444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;

        background:
          radial-gradient(
            circle at top,
            rgba(235, 242, 255, 0.92),
            rgba(255, 255, 255, 0.96) 58%
          ),
          linear-gradient(135deg, #f8fbff, #eef4ff);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: var(--azul);
        text-align: center;
        overflow: hidden;
        position: relative;
      }

      /* =========================
         IMAGEN FONDO
      ========================= */

      .imagen-fondo {
        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        object-fit: contain;
        object-position: center;

        opacity: 0.11;

        filter: grayscale(1) contrast(1.1);

        z-index: -2;

        pointer-events: none;

        transform: scale(1.08) rotate(-6deg);
      }

      /* Glow suave */

      .bg-light {
        position: fixed;

        width: 760px;
        height: 760px;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(30, 60, 114, 0.12),
          transparent 68%
        );

        z-index: -1;

        animation: glow 7s ease-in-out infinite;
      }

      @keyframes glow {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }

        50% {
          transform: scale(1.12);
          opacity: 1;
        }
      }

      /* =========================
         WRAP
      ========================= */

      .wrap {
        width: min(1100px, 92vw);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      /* =========================
         CARD
      ========================= */

      .card {
        width: 100%;

        border: 2px solid rgba(30, 60, 114, 0.1);

        border-radius: 30px;

        padding: 30px 24px;

        box-shadow:
          0 24px 60px rgba(30, 60, 114, 0.14),
          inset 0 0 0 1px rgba(255, 255, 255, 0.45);

        background: rgba(255, 255, 255, 0.74);

        backdrop-filter: blur(14px);
      }

      /* =========================
         DADO 3D
      ========================= */

      .scene {
        width: 250px;
        height: 250px;

        margin: 0 auto 26px;

        perspective: 1200px;
      }

      .dice {
        width: 200px;
        height: 200px;

        position: relative;

        margin: 20px auto;

        transform-style: preserve-3d;

        transform: rotateX(-24deg) rotateY(-38deg) rotateZ(2deg);

        transition: transform 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      .dice.rolling {
        animation: roll 0.55s linear infinite;
      }

      @keyframes roll {
        from {
          transform: rotateX(-24deg) rotateY(-38deg) rotateZ(0deg);
        }

        to {
          transform: rotateX(336deg) rotateY(682deg) rotateZ(360deg);
        }
      }

      .face {
        position: absolute;

        width: 200px;
        height: 200px;

        border-radius: 30px;

        background: linear-gradient(145deg, #ffffff, #dce9ff);

        border: 4px solid rgba(30, 60, 114, 0.14);

        box-shadow:
          inset 0 0 35px rgba(30, 60, 114, 0.1),
          0 14px 30px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 82px;
        font-weight: 900;

        color: var(--azul);
      }

      .front {
        transform: rotateY(0deg) translateZ(100px);
      }
      .back {
        transform: rotateY(180deg) translateZ(100px);
      }
      .right {
        transform: rotateY(90deg) translateZ(100px);
      }
      .left {
        transform: rotateY(-90deg) translateZ(100px);
      }
      .top {
        transform: rotateX(90deg) translateZ(100px);
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(100px);
      }

      /* =========================
         TEXTOS
      ========================= */

      #mesa {
        font-size: clamp(44px, 6vw, 92px);

        font-weight: 900;

        letter-spacing: 1px;

        margin: 6px 0 8px;

        transition: transform 0.2s ease;
      }

      #mesa.pop {
        transform: scale(1.06);
      }

      #mensaje {
        font-size: clamp(18px, 2.2vw, 34px);

        color: var(--gris);

        margin: 0 0 10px;

        min-height: 1.4em;
      }

      #fraseAudio {
        margin: 14px auto 16px;

        max-width: 850px;

        min-height: 2em;

        font-size: clamp(18px, 2vw, 28px);

        color: var(--azul);

        font-weight: 800;

        opacity: 0;

        transform: translateY(8px);

        transition: all 0.35s ease;
      }

      #fraseAudio.show {
        opacity: 1;
        transform: translateY(0);
      }

      .meta {
        font-size: clamp(14px, 1.6vw, 20px);

        color: rgba(30, 60, 114, 0.7);

        margin-top: 10px;
      }

      /* =========================
         BOTÓN
      ========================= */

      .btn {
        font-size: clamp(22px, 3vw, 42px);

        padding: 18px 54px;

        border: none;

        border-radius: 20px;

        background: linear-gradient(135deg, var(--azul), var(--azul2));

        color: white;

        cursor: pointer;

        font-weight: 800;

        box-shadow: 0 16px 32px rgba(30, 60, 114, 0.24);

        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn.secondary {
        background: white;
        color: var(--azul);

        border: 2px solid rgba(30, 60, 114, 0.25);

        box-shadow: none;
      }

      /* =========================
         MODAL
      ========================= */

      .overlay {
        position: fixed;
        inset: 0;

        background: rgba(0, 0, 0, 0.55);

        display: none;

        align-items: center;
        justify-content: center;

        padding: 22px;
      }

      .overlay.show {
        display: flex;
      }

      .modal {
        width: min(760px, 92vw);

        background: white;

        border-radius: 24px;

        padding: 26px;

        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);

        text-align: center;
      }

      .modal h2 {
        margin: 0 0 10px;

        font-size: clamp(26px, 3.4vw, 44px);

        color: var(--azul);
      }

      .modal p {
        margin: 0 0 18px;

        font-size: clamp(16px, 2.1vw, 24px);

        color: var(--gris);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      /* =========================
         CONFETI
      ========================= */

      .spark {
        position: fixed;

        width: 10px;
        height: 10px;

        border-radius: 3px;

        background: rgba(30, 60, 114, 0.35);

        animation: fall 900ms ease-out forwards;

        pointer-events: none;
      }

      @keyframes fall {
        from {
          transform: translateY(-20px) rotate(0deg);

          opacity: 1;
        }

        to {
          transform: translateY(140px) rotate(180deg);

          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- IMAGEN FONDO -->
    <img class="imagen-fondo" src="descarga.png" alt="Conciénciate" />

    <div class="bg-light"></div>

    <div class="wrap">
      <div class="card">
        <!-- DADO -->
        <div class="scene">
          <div class="dice" id="dice">
            <div class="face front">1</div>
            <div class="face right">2</div>
            <div class="face back">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">★</div>
          </div>
        </div>

        <div id="mesa">PULSA PARA ASIGNAR MESA</div>

        <div id="mensaje"></div>

        <div id="fraseAudio"></div>

        <button class="btn" id="btn" onclick="tap()">ASIGNAR MESA</button>

        <div class="meta" id="restantes"></div>
      </div>
    </div>

    <audio id="audioSorteo" preload="auto"></audio>

    <!-- MODAL -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>✅ Mesas asignadas</h2>

        <p>
          Ya han salido todas las mesas.<br />
          ¿Quieres reiniciar para empezar de nuevo?
        </p>

        <div class="actions">
          <button class="btn" onclick="reiniciarTodo()">REINICIAR</button>

          <button class="btn secondary" onclick="cerrarModal()">CERRAR</button>
        </div>
      </div>
    </div>

    <script>
      let mesas = [];
      let armado = false;
      let timerArmado = null;

      const dice = document.getElementById("dice");

      const mesaEl = document.getElementById("mesa");

      const msgEl = document.getElementById("mensaje");

      const fraseAudioEl = document.getElementById("fraseAudio");

      const restEl = document.getElementById("restantes");

      const btn = document.getElementById("btn");

      const overlay = document.getElementById("overlay");

      const frases = [
        "El dado viene fuerte hoy.",

        "Aquí ya hay gente haciendo cálculos mentales.",

        "Esto empieza a ponerse interesante.",

        "El algoritmo no conoce amistades.",

        "El suspense está completamente innecesario… y funciona.",

        "Cada clic cambia destinos.",

        "Esto ya parece una final.",

        "El dado ha hablado.",
      ];

      const posicionesDado = {
        1: "rotateX(0deg) rotateY(0deg)",

        2: "rotateX(0deg) rotateY(-90deg)",

        3: "rotateX(0deg) rotateY(180deg)",

        4: "rotateX(0deg) rotateY(90deg)",

        5: "rotateX(-90deg) rotateY(0deg)",
      };

      function reiniciar() {
        mesas = [];

        for (let i = 1; i <= 5; i++) {
          mesas.push(i);
        }

        actualizarRestantes();

        desarmar();

        fraseAudioEl.textContent = "";

        fraseAudioEl.classList.remove("show");

        dice.classList.remove("rolling");

        dice.style.transform = "rotateX(-24deg) rotateY(-38deg) rotateZ(2deg)";
      }

      function actualizarRestantes() {
        restEl.textContent = `Mesas restantes: ${mesas.length}/5`;
      }

      function cerrarModal() {
        overlay.classList.remove("show");
      }

      function reiniciarTodo() {
        cerrarModal();

        reiniciar();

        mesaEl.textContent = "PULSA PARA ASIGNAR MESA";

        msgEl.textContent = "";
      }

      function elegirAleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      function mostrarFrase() {
        fraseAudioEl.classList.remove("show");

        setTimeout(() => {
          fraseAudioEl.textContent = elegirAleatorio(frases);

          fraseAudioEl.classList.add("show");
        }, 80);
      }

      function confetiSuave() {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("div");

          s.className = "spark";

          const x = window.innerWidth / 2 + (Math.random() * 320 - 160);

          const y = window.innerHeight / 2 + (Math.random() * 80 - 40);

          s.style.left = x + "px";

          s.style.top = y + "px";

          document.body.appendChild(s);

          setTimeout(() => s.remove(), 900);
        }
      }

      function animarTexto() {
        mesaEl.classList.remove("pop");

        void mesaEl.offsetWidth;

        mesaEl.classList.add("pop");

        confetiSuave();
      }

      function armar() {
        armado = true;

        btn.textContent = "CONFIRMAR";

        msgEl.textContent = "Pulsa otra vez para confirmar la mesa.";

        fraseAudioEl.textContent = "";

        fraseAudioEl.classList.remove("show");

        dice.classList.add("rolling");

        clearTimeout(timerArmado);

        timerArmado = setTimeout(desarmar, 3000);
      }

      function desarmar() {
        armado = false;

        btn.textContent = "ASIGNAR MESA";

        clearTimeout(timerArmado);

        timerArmado = null;

        if (mesas.length > 0) {
          dice.classList.remove("rolling");
        }
      }

      function sacarMesaConfirmada() {
        if (mesas.length === 0) {
          overlay.classList.add("show");

          return;
        }

        const index = Math.floor(Math.random() * mesas.length);

        const numero = mesas[index];

        mesas.splice(index, 1);

        dice.classList.remove("rolling");

        setTimeout(() => {
          dice.style.transform =
            posicionesDado[numero] +
            " rotateX(-18deg) rotateY(-18deg) rotateZ(" +
            Math.floor(Math.random() * 4) * 360 +
            "deg)";
        }, 40);

        mesaEl.textContent = "MESA NÚMERO " + numero;

        msgEl.textContent =
          "Gracias por tu paciencia. Entre todos hacemos un espacio mejor.";

        mostrarFrase();

        actualizarRestantes();

        animarTexto();
      }

      function tap() {
        if (mesas.length === 0) {
          overlay.classList.add("show");

          return;
        }

        if (!armado) {
          armar();

          return;
        }

        desarmar();

        sacarMesaConfirmada();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
        }
      });

      reiniciar();
    </script>
  </body>
</html>
