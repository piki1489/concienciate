<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asignación de Mesas - Conciénciate</title>

    <style>
      :root {
        --azul: #1e3c72;
        --azul2: #2a5298;
        --gris: #444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #f8fbff, #eef4ff);

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: var(--azul);
        text-align: center;

        overflow: hidden;
        position: relative;
      }

      .imagen-fondo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        opacity: 0.26;
        filter: grayscale(1) contrast(1.15);
        z-index: -3;
        pointer-events: none;
        transform: scale(1.08) rotate(-6deg);
      }

      .wrap {
        width: min(1100px, 92vw);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        padding: 24px 28px 30px;
        border-radius: 36px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.06)
        );

        border: 1px solid rgba(255, 255, 255, 0.22);

        box-shadow:
          0 18px 55px rgba(0, 0, 0, 1),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }

      .scene {
        width: 250px;
        height: 250px;
        margin: 0 auto 26px;
        perspective: 1200px;
      }

      .dice {
        width: 200px;
        height: 200px;
        position: relative;
        margin: 20px auto;
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-38deg) rotateZ(2deg);
        transition: transform 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      .dice.rolling {
        animation: roll 0.55s linear infinite;
      }

      @keyframes roll {
        from {
          transform: rotateX(-24deg) rotateY(-38deg) rotateZ(0deg);
        }

        to {
          transform: rotateX(336deg) rotateY(682deg) rotateZ(360deg);
        }
      }

      .face {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 30px;

        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(220, 233, 255, 0.92)
        );

        border: 4px solid rgba(30, 60, 114, 0.14);

        box-shadow:
          inset 0 0 35px rgba(30, 60, 114, 0.1),
          0 14px 30px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 82px;
        font-weight: 900;
        color: var(--azul);
      }

      .front {
        transform: rotateY(0deg) translateZ(100px);
      }
      .back {
        transform: rotateY(180deg) translateZ(100px);
      }
      .right {
        transform: rotateY(90deg) translateZ(100px);
      }
      .left {
        transform: rotateY(-90deg) translateZ(100px);
      }
      .top {
        transform: rotateX(90deg) translateZ(100px);
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(100px);
      }

      #mesa {
        font-size: clamp(44px, 6vw, 92px);
        font-weight: 900;
        letter-spacing: 1px;
        margin: 6px 0 8px;
        transition: transform 0.2s ease;

        text-shadow:
          0 4px 0 rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(255, 255, 255, 0.9);
      }

      #mesa.pop {
        transform: scale(1.06);
      }

      #mensaje {
        font-size: clamp(18px, 2.2vw, 34px);
        color: var(--gris);
        margin: 0 0 10px;
        min-height: 1.4em;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      #fraseAudio {
        margin: 14px auto 16px;
        max-width: 900px;
        min-height: 2em;
        font-size: clamp(18px, 2vw, 28px);
        color: var(--azul);
        font-weight: 800;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.35s ease;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      #fraseAudio.show {
        opacity: 1;
        transform: translateY(0);
      }

      .meta {
        font-size: clamp(14px, 1.6vw, 20px);
        color: rgba(30, 60, 114, 0.78);
        margin-top: 10px;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      .btn {
        font-size: clamp(22px, 3vw, 42px);
        padding: 18px 54px;
        border: none;
        border-radius: 20px;

        background: linear-gradient(135deg, var(--azul), var(--azul2));

        color: white;
        cursor: pointer;
        font-weight: 800;

        box-shadow: 0 16px 32px rgba(30, 60, 114, 0.24);

        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn.secondary {
        background: white;
        color: var(--azul);
        border: 2px solid rgba(30, 60, 114, 0.25);
        box-shadow: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 22px;
      }

      .overlay.show {
        display: flex;
      }

      .modal {
        width: min(760px, 92vw);
        background: white;
        border-radius: 24px;
        padding: 26px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .modal h2 {
        margin: 0 0 10px;
        font-size: clamp(26px, 3.4vw, 44px);
        color: var(--azul);
      }

      .modal p {
        margin: 0 0 18px;
        font-size: clamp(16px, 2.1vw, 24px);
        color: var(--gris);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .spark {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: rgba(30, 60, 114, 0.35);
        animation: fall 900ms ease-out forwards;
        pointer-events: none;
      }

      @keyframes fall {
        from {
          transform: translateY(-20px) rotate(0deg);
          opacity: 1;
        }

        to {
          transform: translateY(140px) rotate(180deg);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <img class="imagen-fondo" src="descarga.png" alt="Conciénciate" />

    <div class="wrap">
      <div class="card">
        <div class="scene">
          <div class="dice" id="dice">
            <div class="face front">1</div>
            <div class="face right">2</div>
            <div class="face back">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">★</div>
          </div>
        </div>

        <div id="mesa">PULSA PARA ASIGNAR MESA</div>

        <div id="mensaje"></div>

        <div id="fraseAudio"></div>

        <button class="btn" id="btn" onclick="tap()">ASIGNAR MESA</button>

        <div class="meta" id="restantes"></div>
      </div>
    </div>

    <audio id="audioSorteo" preload="auto"></audio>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>✅ Mesas asignadas</h2>

        <p>
          Ya han salido todas las mesas.<br />
          ¿Quieres reiniciar para empezar de nuevo?
        </p>

        <div class="actions">
          <button class="btn" onclick="reiniciarTodo()">REINICIAR</button>
          <button class="btn secondary" onclick="cerrarModal()">CERRAR</button>
        </div>
      </div>
    </div>

    <script>
      let mesas = [];
      let armado = false;
      let timerArmado = null;

      const dice = document.getElementById("dice");
      const mesaEl = document.getElementById("mesa");
      const msgEl = document.getElementById("mensaje");
      const fraseAudioEl = document.getElementById("fraseAudio");
      const restEl = document.getElementById("restantes");
      const btn = document.getElementById("btn");
      const overlay = document.getElementById("overlay");

      /*
        Preparado para audio futuro:
        Cada frase usa datos reales:
        {salida} = mesa que acaba de salir
        {quedan} = mesas que quedan
        {queda} = mesa que queda cuando solo queda una
        {primeraRestante} y {segundaRestante} = cuando quedan dos
      */

      const frasesPorEstado = {
        quedan4: [
          "Sale la mesa {salida}. Primera en salir, primera en cenar. El dado ya ha marcado territorio.",
          "Mesa {salida} asignada. Empieza fuerte la noche y quedan las mesas {quedan} esperando turno.",
          "La mesa {salida} ya puede respirar tranquila. Las mesas {quedan} siguen mirando al dado con respeto.",
          "Primera elegida: mesa {salida}. Esto acaba de empezar y el dado ya se cree presentador de televisión.",
          "Mesa {salida} fuera. Quedan {quedan}. Todavía hay margen para hacerse el interesante.",
          "Arranca la mesa {salida}. Las demás, {quedan}, siguen en modo paciencia profesional.",
          "La mesa {salida} se adelanta. Las mesas {quedan} acaban de descubrir que esto iba en serio.",
          "Mesa {salida} asignada. El dado ha hablado poco, pero ha hablado claro.",
        ],

        quedan3: [
          "Sale la mesa {salida}. Quedan las mesas {quedan}, y aquí ya empiezan los cálculos de ingeniería.",
          "Mesa {salida} servida por el destino. Las mesas {quedan} siguen en la sala de espera del dado.",
          "La mesa {salida} avanza. Quedan {quedan}, y el suspense está siendo totalmente innecesario.",
          "Mesa {salida} asignada. Las mesas {quedan} empiezan a pensar que el dado tiene favoritos.",
          "Sale la mesa {salida}. Quedan {quedan}. Esto ya parece una eliminatoria absurda pero emocionante.",
          "La mesa {salida} ya tiene vía libre. Las mesas {quedan} siguen aguantando el tipo.",
          "Mesa {salida} fuera. Quedan {quedan}. El dado está disfrutando demasiado de este momento.",
          "Sale la mesa {salida}. Las mesas {quedan} siguen vivas en esta competición gastronómica.",
        ],

        quedan2: [
          "Sale la mesa {salida}. Quedan la mesa {primeraRestante} y la mesa {segundaRestante}. Una cenará antes, la otra con más suspense.",
          "Mesa {salida} asignada. Ahora quedan {primeraRestante} y {segundaRestante}. Aquí se come seguro, pero alguien va a practicar paciencia.",
          "Sale la mesa {salida}. Solo quedan dos: {primeraRestante} y {segundaRestante}. El dado ya está haciendo teatro.",
          "Mesa {salida} fuera. Quedan {primeraRestante} y {segundaRestante}. Esto ya es cara o cruz con mantel.",
          "La mesa {salida} se adelanta. Las mesas {primeraRestante} y {segundaRestante} siguen mirándose como finalistas.",
          "Mesa {salida} asignada. Quedan {primeraRestante} y {segundaRestante}. Una sale ahora y la otra se come el final dramático.",
          "Sale la mesa {salida}. Quedan {primeraRestante} y {segundaRestante}. El dado está alargando esto por puro espectáculo.",
          "Mesa {salida} lista. Las mesas {primeraRestante} y {segundaRestante} acaban de entrar en modo final de torneo.",
        ],

        queda1: [
          "Sale la mesa {salida}. Solo queda la mesa {queda}. La última cena, pero con entrada triunfal.",
          "Mesa {salida} asignada. Queda la mesa {queda}. Se ha guardado el protagonismo para el final.",
          "Sale la mesa {salida}. La mesa {queda} queda para el cierre. Alguien tenía que poner el drama.",
          "Mesa {salida} fuera. Solo queda la mesa {queda}. Va a cenar la última, pero con categoría.",
          "La mesa {salida} ya está dentro. La mesa {queda} se queda como final de temporada.",
          "Sale la mesa {salida}. Queda la mesa {queda}. Ya no es espera, es escena final.",
          "Mesa {salida} asignada. La mesa {queda} se queda sola ante el dado, como en una película.",
          "Sale la mesa {salida}. Última pendiente: mesa {queda}. Está tardando, pero está quedando elegante.",
        ],

        final: [
          "Última mesa: la {salida}. Cierra el sorteo tarde, pero con aplausos imaginarios.",
          "Y termina la mesa {salida}. Ha sido la última, sí, pero también la más cinematográfica.",
          "Mesa {salida} para cerrar. El dado se despide como si hubiera hecho una obra maestra.",
          "Última asignada: mesa {salida}. Se acabó el suspense y empieza lo importante.",
          "Cierra la mesa {salida}. El dado ha trabajado duro y ahora exige reconocimiento.",
          "Mesa {salida}, final del recorrido. Llegó tarde, pero llegó con estilo.",
          "Y la última es la mesa {salida}. Final elegante para un sorteo absurdamente emocionante.",
          "Mesa {salida} cerrando el evento. El algoritmo cocinó el drama hasta el último segundo.",
        ],
      };

      const posicionesDado = {
        1: "rotateX(-8deg) rotateY(0deg)",
        2: "rotateX(-8deg) rotateY(-90deg)",
        3: "rotateX(-8deg) rotateY(180deg)",
        4: "rotateX(-8deg) rotateY(90deg)",
        5: "rotateX(-98deg) rotateY(0deg)",
      };

      function reiniciar() {
        mesas = [];

        for (let i = 1; i <= 5; i++) {
          mesas.push(i);
        }

        actualizarRestantes();
        desarmar();

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");

        dice.classList.remove("rolling");

        dice.style.transform = "rotateX(-24deg) rotateY(-38deg) rotateZ(2deg)";
      }

      function actualizarRestantes() {
        restEl.textContent = `Mesas restantes: ${mesas.length}/5`;
      }

      function cerrarModal() {
        overlay.classList.remove("show");
      }

      function reiniciarTodo() {
        cerrarModal();

        reiniciar();

        mesaEl.textContent = "PULSA PARA ASIGNAR MESA";

        msgEl.textContent = "";
      }

      function elegirAleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      function formatearListaMesas(lista) {
        if (lista.length === 0) return "";
        if (lista.length === 1) return lista[0].toString();
        if (lista.length === 2) return lista[0] + " y " + lista[1];

        return lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1];
      }

      function obtenerFraseDinamica(numeroMesaQueSale) {
        const restantes = [...mesas].sort((a, b) => a - b);

        let bloque = null;

        if (restantes.length === 4) {
          bloque = frasesPorEstado.quedan4;
        } else if (restantes.length === 3) {
          bloque = frasesPorEstado.quedan3;
        } else if (restantes.length === 2) {
          bloque = frasesPorEstado.quedan2;
        } else if (restantes.length === 1) {
          bloque = frasesPorEstado.queda1;
        } else {
          bloque = frasesPorEstado.final;
        }

        let frase = elegirAleatorio(bloque);

        frase = frase
          .replaceAll("{salida}", numeroMesaQueSale)
          .replaceAll("{quedan}", formatearListaMesas(restantes))
          .replaceAll("{queda}", restantes[0] ?? "")
          .replaceAll("{primeraRestante}", restantes[0] ?? "")
          .replaceAll("{segundaRestante}", restantes[1] ?? "");

        return frase;
      }

      function mostrarFrase(numeroMesaQueSale) {
        fraseAudioEl.classList.remove("show");

        setTimeout(() => {
          fraseAudioEl.textContent = obtenerFraseDinamica(numeroMesaQueSale);

          fraseAudioEl.classList.add("show");
        }, 80);
      }

      function confetiSuave() {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("div");

          s.className = "spark";

          const x = window.innerWidth / 2 + (Math.random() * 320 - 160);

          const y = window.innerHeight / 2 + (Math.random() * 80 - 40);

          s.style.left = x + "px";
          s.style.top = y + "px";

          document.body.appendChild(s);

          setTimeout(() => s.remove(), 900);
        }
      }

      function animarTexto() {
        mesaEl.classList.remove("pop");

        void mesaEl.offsetWidth;

        mesaEl.classList.add("pop");

        confetiSuave();
      }

      function armar() {
        armado = true;

        btn.textContent = "CONFIRMAR";

        msgEl.textContent = "Pulsa otra vez para confirmar la mesa.";

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");

        dice.classList.add("rolling");

        clearTimeout(timerArmado);

        timerArmado = setTimeout(desarmar, 3000);
      }

      function desarmar() {
        armado = false;

        btn.textContent = "ASIGNAR MESA";

        clearTimeout(timerArmado);

        timerArmado = null;

        if (mesas.length > 0) {
          dice.classList.remove("rolling");
        }
      }

      function sacarMesaConfirmada() {
        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        const index = Math.floor(Math.random() * mesas.length);

        const numero = mesas[index];

        mesas.splice(index, 1);

        dice.classList.remove("rolling");

        setTimeout(() => {
          dice.style.transform =
            posicionesDado[numero] +
            " rotateZ(" +
            Math.floor(Math.random() * 4) * 360 +
            "deg)";
        }, 40);

        setTimeout(() => {
          mesaEl.textContent = "MESA NÚMERO " + numero;

          msgEl.textContent =
            "Gracias por tu paciencia. Entre todos hacemos un espacio mejor.";

          mostrarFrase(numero);

          actualizarRestantes();

          animarTexto();
        }, 1250);
      }

      function tap() {
        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        if (!armado) {
          armar();
          return;
        }

        desarmar();

        sacarMesaConfirmada();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
        }
      });

      reiniciar();
    </script>
  </body>
</html>
