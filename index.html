<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asignación de Mesas - Conciénciate</title>

    <style>
      :root {
        --azul: #12335f;
        --azul2: #2467a6;
        --coral: #e85d4f;
        --verde: #1f8a70;
        --oro: #f1b84b;
        --gris: #27313c;
        --blanco: rgba(255, 255, 255, 0.96);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        padding: clamp(8px, 1.4vh, 16px) 0;
        background:
          radial-gradient(
            circle at 12% 18%,
            rgba(241, 184, 75, 0.26),
            transparent 28%
          ),
          radial-gradient(
            circle at 86% 22%,
            rgba(232, 93, 79, 0.18),
            transparent 30%
          ),
          linear-gradient(135deg, #f7fbff 0%, #eef6f2 48%, #fff5ed 100%);

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: var(--azul);
        text-align: center;

        overflow: hidden;
        position: relative;
      }

      .imagen-fondo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        opacity: 0.18;
        filter: grayscale(1) contrast(1.18);
        z-index: -3;
        pointer-events: none;
        transform: scale(1.08) rotate(-6deg);
      }

      .wrap {
        width: min(1180px, 94vw);
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        max-height: calc(100vh - 16px);
        padding: clamp(14px, 2.2vw, 30px);
        border-radius: 8px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.72)
        );

        border: 1px solid rgba(18, 51, 95, 0.12);

        box-shadow:
          0 22px 65px rgba(18, 51, 95, 0.18),
          inset 0 0 0 1px rgba(255, 255, 255, 0.76);

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .scene {
        width: clamp(150px, 18vh, 230px);
        height: clamp(150px, 18vh, 230px);
        margin: 0 auto clamp(8px, 1.5vh, 16px);
        perspective: 1200px;
      }

      .dice {
        width: clamp(130px, 15.5vh, 190px);
        height: clamp(130px, 15.5vh, 190px);
        position: relative;
        margin: 20px auto;
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-38deg) rotateZ(2deg);
        transition: transform 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      .dice.rolling {
        animation: roll 0.55s linear infinite;
      }

      @keyframes roll {
        from {
          transform: rotateX(-24deg) rotateY(-38deg) rotateZ(0deg);
        }

        to {
          transform: rotateX(336deg) rotateY(682deg) rotateZ(360deg);
        }
      }

      .face {
        position: absolute;
        width: clamp(130px, 15.5vh, 190px);
        height: clamp(130px, 15.5vh, 190px);
        border-radius: 8px;

        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(220, 233, 255, 0.92)
        );

        border: 4px solid rgba(30, 60, 114, 0.14);

        box-shadow:
          inset 0 0 35px rgba(30, 60, 114, 0.1),
          0 14px 30px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(60px, 7vh, 88px);
        font-weight: 900;
        color: var(--azul);
      }

      .front {
        transform: rotateY(0deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .back {
        transform: rotateY(180deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .right {
        transform: rotateY(90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .left {
        transform: rotateY(-90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .top {
        transform: rotateX(90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(clamp(65px, 7.75vh, 95px));
      }

      #mesa {
        font-size: clamp(40px, 8vh, 92px);
        font-weight: 900;
        letter-spacing: 1px;
        margin: 4px 0 8px;
        transition: transform 0.2s ease;

        text-shadow:
          0 4px 0 rgba(255, 255, 255, 0.95),
          0 14px 30px rgba(255, 255, 255, 0.9);
      }

      #mesa.pop {
        transform: scale(1.06);
      }

      #mensaje {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: min(560px, 92vw);
        min-height: 1.8em;
        padding: 7px 18px;
        border-radius: 8px;
        font-size: clamp(20px, 3.2vh, 34px);
        color: white;
        background: linear-gradient(135deg, var(--coral), var(--azul2));
        margin: 0 0 12px;
        font-weight: 900;
        min-height: 1.4em;

        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.24);
      }

      #cuentaAtras {
        height: 0;
        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          height 0.18s ease;
        color: var(--coral);
        font-size: clamp(56px, 10vh, 120px);
        font-weight: 900;
        line-height: 0.95;
        text-shadow:
          0 5px 0 rgba(255, 255, 255, 0.95),
          0 16px 32px rgba(18, 51, 95, 0.2);
      }

      #cuentaAtras.show {
        height: clamp(54px, 10vh, 116px);
        opacity: 1;
        transform: scale(1);
      }

      #cuentaAtras.pop {
        animation: countdown-pop 0.28s ease;
      }

      @keyframes countdown-pop {
        0% {
          transform: scale(0.72);
        }

        70% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      #fraseAudio {
        margin: clamp(8px, 1.4vh, 12px) auto clamp(8px, 1.4vh, 12px);
        width: min(900px, 92vw);
        min-height: 2.4em;
        font-size: clamp(17px, 2.6vh, 26px);
        color: var(--gris);
        font-weight: 700;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.35s ease;

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      #fraseAudio.show {
        opacity: 1;
        transform: translateY(0);
      }

      .frase-linea {
        display: block;
      }

      .player {
        width: min(620px, 90vw);
        margin: clamp(6px, 1vh, 10px) auto clamp(8px, 1.2vh, 12px);
        padding: 8px 12px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.92),
          rgba(237, 246, 255, 0.86)
        );
        border: 1px solid rgba(18, 51, 95, 0.14);
        box-shadow: 0 12px 28px rgba(18, 51, 95, 0.12);
        display: none;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "info controls"
          "progress progress";
        gap: 6px 10px;
        align-items: center;
      }

      .player.show {
        display: grid;
      }

      .player-controls {
        grid-area: controls;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .player-btn {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: var(--azul);
        color: white;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(18, 51, 95, 0.18);
        transition:
          transform 0.18s ease,
          background 0.18s ease,
          opacity 0.18s ease;
      }

      .player-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        background: var(--verde);
      }

      .player-btn:disabled {
        cursor: default;
        opacity: 0.36;
      }

      .player-main {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, var(--coral), var(--azul2));
        font-size: 22px;
      }

      .player-info {
        grid-area: info;
        min-width: 0;
        text-align: left;
        color: var(--gris);
        font-weight: 800;
      }

      .player-kicker {
        display: block;
        color: rgba(18, 51, 95, 0.7);
        font-size: 11px;
        text-transform: uppercase;
      }

      .player-title {
        display: block;
        margin-top: 1px;
        font-size: clamp(14px, 1.7vh, 17px);
        line-height: 1.18;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-progress {
        grid-area: progress;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        gap: 7px;
        align-items: center;
        color: rgba(18, 51, 95, 0.78);
        font-size: 12px;
        font-weight: 900;
      }

      .time-label {
        font-variant-numeric: tabular-nums;
      }

      .range {
        width: 100%;
        accent-color: var(--coral);
        cursor: pointer;
      }

      .song-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 4px auto 10px;
        color: rgba(18, 51, 95, 0.72);
        font-size: 12px;
        font-weight: 800;
      }

      .song-loader input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .song-loader-btn {
        border: 1px solid rgba(18, 51, 95, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--azul);
        cursor: pointer;
        font-size: 12px;
        font-weight: 900;
        padding: 7px 10px;
      }

      .meta {
        font-size: clamp(16px, 1.7vw, 22px);
        color: rgba(18, 51, 95, 0.82);
        margin-top: clamp(8px, 1.2vh, 12px);

        text-shadow: 0 8px 24px rgba(255, 255, 255, 0.95);
      }

      .btn {
        font-size: clamp(20px, 3.4vh, 38px);
        padding: clamp(12px, 2vh, 18px) clamp(38px, 7vw, 76px);
        border: none;
        border-radius: 8px;

        background: linear-gradient(135deg, var(--azul), var(--verde));

        color: white;
        cursor: pointer;
        font-weight: 800;

        box-shadow: 0 16px 32px rgba(18, 51, 95, 0.24);

        transition: all 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn:disabled {
        cursor: default;
        opacity: 0.86;
        transform: none;
      }

      .btn.secondary {
        background: white;
        color: var(--azul);
        border: 2px solid rgba(30, 60, 114, 0.25);
        box-shadow: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 22px;
      }

      .overlay.show {
        display: flex;
      }

      .modal {
        width: min(760px, 92vw);
        background: white;
        border-radius: 8px;
        padding: 26px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .modal h2 {
        margin: 0 0 10px;
        font-size: clamp(26px, 3.4vw, 44px);
        color: var(--azul);
      }

      .modal p {
        margin: 0 0 18px;
        font-size: clamp(16px, 2.1vw, 24px);
        color: var(--gris);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .spark {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: rgba(30, 60, 114, 0.35);
        animation: fall 900ms ease-out forwards;
        pointer-events: none;
      }

      @keyframes fall {
        from {
          transform: translateY(-20px) rotate(0deg);
          opacity: 1;
        }

        to {
          transform: translateY(140px) rotate(180deg);
          opacity: 0;
        }
      }

      @media (max-height: 760px) {
        .card {
          padding: 10px 20px;
        }

        .scene {
          width: 132px;
          height: 132px;
          margin-bottom: 6px;
        }

        .dice,
        .face {
          width: 112px;
          height: 112px;
        }

        .face {
          font-size: 52px;
        }

        .front {
          transform: rotateY(0deg) translateZ(56px);
        }
        .back {
          transform: rotateY(180deg) translateZ(56px);
        }
        .right {
          transform: rotateY(90deg) translateZ(56px);
        }
        .left {
          transform: rotateY(-90deg) translateZ(56px);
        }
        .top {
          transform: rotateX(90deg) translateZ(56px);
        }
        .bottom {
          transform: rotateX(-90deg) translateZ(56px);
        }

        #mesa {
          font-size: 54px;
          margin-bottom: 4px;
        }

        #mensaje {
          font-size: 24px;
        }

        #fraseAudio {
          font-size: 18px;
          min-height: 2em;
        }

        .meta {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .player {
          grid-template-columns: 1fr;
          grid-template-areas:
            "info"
            "controls"
            "progress";
        }

        .player-info {
          text-align: center;
        }

        .player-progress {
          grid-template-columns: 44px minmax(0, 1fr) 44px;
        }
      }
    </style>
  </head>

  <body>
    <img class="imagen-fondo" src="descarga.png" alt="Conciénciate" />

    <div class="wrap">
      <div class="card">
        <div class="scene">
          <div class="dice" id="dice">
            <div class="face front">1</div>
            <div class="face right">2</div>
            <div class="face back">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">★</div>
          </div>
        </div>

        <div id="mesa">PULSA PARA ASIGNAR MESA</div>

        <div id="mensaje"></div>

        <div id="cuentaAtras" aria-live="polite"></div>

        <div id="fraseAudio"></div>

        <div class="player" id="player">
          <div class="player-info">
            <span class="player-kicker" id="playerKicker">Playlist</span>
            <span class="player-title" id="playerTitle"
              >Sin musica todavia</span
            >
          </div>
          <div class="player-controls">
            <button
              class="player-btn"
              id="prevBtn"
              type="button"
              onclick="cancionAnterior()"
              title="Cancion anterior"
            >
              ‹
            </button>
            <button
              class="player-btn player-main"
              id="playBtn"
              type="button"
              onclick="alternarPlay()"
              title="Play/Pausa"
            >
              ▶
            </button>
            <button
              class="player-btn"
              id="nextBtn"
              type="button"
              onclick="cancionSiguienteManual()"
              title="Siguiente cancion"
            >
              ›
            </button>
          </div>
          <div class="player-progress">
            <span class="time-label" id="currentTime">0:00</span>
            <input
              class="range"
              id="progressRange"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Progreso de la cancion"
            />
            <span class="time-label" id="durationTime">0:00</span>
          </div>
        </div>

        <label class="song-loader">
          <span class="song-loader-btn">AÑADIR CANCIONES</span>
          <span id="songLoaderStatus">Carpeta canciones</span>
          <input
            id="songFiles"
            type="file"
            accept="audio/mpeg,audio/mp3,.mp3"
            multiple
          />
        </label>

        <button class="btn" id="btn" onclick="tap()">ASIGNAR MESA</button>

        <div class="meta" id="restantes"></div>
      </div>
    </div>

    <audio id="audioSorteo" src="sorteo.mp3" preload="auto"></audio>
    <audio id="audioMesa" preload="auto"></audio>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>✅ Mesas asignadas</h2>

        <p>
          Ya han salido todas las mesas.<br />
          ¿Quieres reiniciar para empezar de nuevo?
        </p>

        <div class="actions">
          <button class="btn" onclick="reiniciarTodo()">REINICIAR</button>
          <button class="btn secondary" onclick="cerrarModal()">CERRAR</button>
        </div>
      </div>
    </div>

    <script>
      let mesas = [];
      let asignandoMesa = false;
      let cuentaTimer = null;
      let colaCanciones = [];
      let indiceCancion = -1;
      let cancionActual = null;
      let cancionesUsuario = [];
      let urlCancionTemporal = "";
      let sesionAudio = 0;
      let usuarioPausoMusica = false;
      let pausaInterna = false;
      let protegiendoMusica = false;
      let fraseMesaActual = "";
      const CLAVE_CANCIONES_USADAS = "concienciate.cancionesUsadas.v1";
      const DB_CANCIONES = "concienciate-canciones";
      const DB_VERSION = 1;
      const STORE_CANCIONES = "canciones";

      const dice = document.getElementById("dice");
      const mesaEl = document.getElementById("mesa");
      const msgEl = document.getElementById("mensaje");
      const cuentaEl = document.getElementById("cuentaAtras");
      const fraseAudioEl = document.getElementById("fraseAudio");
      const restEl = document.getElementById("restantes");
      const btn = document.getElementById("btn");
      const overlay = document.getElementById("overlay");
      const audioSorteo = document.getElementById("audioSorteo");
      const audioMesa = document.getElementById("audioMesa");
      const player = document.getElementById("player");
      const prevBtn = document.getElementById("prevBtn");
      const playBtn = document.getElementById("playBtn");
      const nextBtn = document.getElementById("nextBtn");
      const playerKicker = document.getElementById("playerKicker");
      const playerTitle = document.getElementById("playerTitle");
      const progressRange = document.getElementById("progressRange");
      const currentTimeEl = document.getElementById("currentTime");
      const durationTimeEl = document.getElementById("durationTime");
      const songFiles = document.getElementById("songFiles");
      const songLoaderStatus = document.getElementById("songLoaderStatus");

      const CANCIONES = [
        "canciones/Aerosmith - I Don't Want to Miss a Thing .mp3",
        "canciones/Extremoduro - La vereda de la puerta de atras.mp3",
        "canciones/Bon Jovi - Livin' On A Prayer [lDK9QqIzhwk].mp3",
        "canciones/Dire Straits - Sultans Of Swing (Official Music Video) [h0ffIJ7ZO4U].mp3",
        "canciones/BON JOVI - BED OF ROSES.mp3",
        "canciones/Guns N' Roses - Sweet Child O' Mine (Official Music Video) [1w7OgIMMRc4].mp3",
        "canciones/Extremoduro - Stand By [ZH05IaSy2hE].mp3",

        "canciones/Depeche Mode - Enjoy the Silence.mp3",

        "canciones/Extremoduro - Salir.mp3",
        "canciones/BON JOVI - ALWAYS.mp3",
        "canciones/Michael Jackson - Billie Jean (Official Video) [Zi_XLOBDo_Y].mp3",
        "canciones/R.E.M. - Losing My Religion (Official HD Music Video) [xwtdhWltSIg].mp3",
        "canciones/Estopa - Como Camaron (Videoclip) [JmP89cIGJZM].mp3",
        "canciones/Los Delinqüentes - El aire de la calle [RbRzHhmVR64].mp3",
        "canciones/Estopa - Me Falta el Aliento (Directo Acústico) [SOsFYpBQz80].mp3",
        "canciones/Depeche Mode - Personal Jesus.mp3",
        "canciones/Alan Parsons Project - Eye In The Sky.mp3",
        "canciones/Gipsy Kings - Volare (Nel Blu di Pinto di Blu) (Official HD Video) [X8TOhb_4jU0].mp3",
        "canciones/Manolo Garcia - Pajaros de Barro [HSpeF-Bu26E].mp3",
        "canciones/Héroes del Silencio - La chispa adecuada [jnDjEHyhFpU].mp3",
        "canciones/Loquillo Y Los Trogloditas - Cadillac Solitario [vvitGvSA1EI].mp3",
        "canciones/Los Rodriguez - Sin Documentos (Videoclip oficial) [BUKHMGiW_rY].mp3",
      ];

      /*
        Frases dinámicas para acompañar cada asignación:
        Cada frase usa datos reales:
        {salida} = mesa que acaba de salir
        {quedan} = mesas que quedan
        {queda} = mesa que queda cuando solo queda una
        {primeraRestante} y {segundaRestante} = cuando quedan dos
      */

      const frasesPorEstado = {
        quedan4: [
          "La elegida es la mesa {salida}. El dado empieza fuerte.",
          "Mesa {salida}. Primera ronda con estilo.",
          "La mesa {salida} se adelanta. Las demás calientan.",

        quedan3: [

          "La mesa {salida} avanza. Quedan {quedan}.",
          "Mesa {salida}. Suspense justo, hambre real.",
          "Turno para la mesa {salida}. Quedan {quedan} resistiendo.",
          "Mesa {salida}. El dado sigue mandando.",
          "La mesa {salida} pasa delante. Sin pedir permiso.",
          "Mesa {salida}. Esto se pone interesante.",
        ],

        quedan2: [
          "Le toca a la mesa {salida}. Quedan {primeraRestante} y {segundaRestante}.",
          "Mesa {salida}. Final apretado entre {primeraRestante} y {segundaRestante}.",
          "La mesa {salida} se adelanta. Quedan dos finalistas.",
          "Mesa {salida}. Ahora viene el cara o cruz.",
          "Turno para la mesa {salida}. {primeraRestante} y {segundaRestante} siguen vivas.",
          "Mesa {salida}. El final ya huele a cena.",
          "La mesa {salida} pasa. Quedan {primeraRestante} y {segundaRestante}.",
          "Mesa {salida}. Esto ya es final de torneo.",
        ],

        queda1: [
          "La elegida es la mesa {salida}. Solo queda la {queda}.",
          "Mesa {salida}. La {queda} cierra la fiesta.",
          "La mesa {salida} entra. La {queda} guarda el final.",
          "Mesa {salida}. Queda la {queda}, con suspense.",
          "Turno para la mesa {salida}. La {queda} va de estrella final.",
          "Mesa {salida}. Última pendiente: la {queda}.",
          "La mesa {salida} pasa. La {queda} respira hondo.",
          "Mesa {salida}. La {queda} se queda para el cierre.",
        ],

        final: [
          "Última mesa: la {salida}. Cierre con estilo.",
          "Mesa {salida}. Se acabó el suspense.",
          "Cierra la mesa {salida}. El dado descansa.",
          "Mesa {salida}. Llegó tarde, llegó elegante.",
          "Última asignada: mesa {salida}. Ahora sí.",
          "Mesa {salida}. Final digno de aplauso.",
          "Y la última es la {salida}. Buen cierre.",
          "Mesa {salida}. Se acabó el show.",
        ],
      };

      const posicionesDado = {
        1: "rotateX(-8deg) rotateY(0deg)",
        2: "rotateX(-8deg) rotateY(-90deg)",
        3: "rotateX(-8deg) rotateY(180deg)",
        4: "rotateX(-8deg) rotateY(90deg)",
        5: "rotateX(-98deg) rotateY(0deg)",
      };

      function reiniciar() {
        mesas = [];

        for (let i = 1; i <= 5; i++) {
          mesas.push(i);
        }

        actualizarRestantes();
        desbloquearBotonAsignar();

        cuentaEl.textContent = "";
        cuentaEl.classList.remove("show", "pop");
        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");
        msgEl.removeAttribute("style");

        dice.classList.remove("rolling");

        dice.style.transform = "rotateX(-24deg) rotateY(-38deg) rotateZ(2deg)";
      }

      function actualizarRestantes() {
        restEl.textContent = `Mesas restantes: ${mesas.length}/5`;
      }

      function cerrarModal() {
        overlay.classList.remove("show");
      }

      function reiniciarTodo() {
        cerrarModal();

        reiniciar();

        mesaEl.textContent = "PULSA PARA ASIGNAR MESA";

        msgEl.textContent = "";
      }

      function elegirAleatorio(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      function limpiarNombreCancion(ruta) {
        const archivo = decodeURIComponent(ruta.split("/").pop() || ruta);

        return archivo
          .replace(/\.mp3$/i, "")
          .replace(/\s*\[[^\]]+\]\s*$/g, "")
          .replace(
            /\s*\([^)]*(Official|Video|Videoclip|Audio|Remasterizado|HD|4K)[^)]*\)\s*/gi,
            " ",
          )
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function formatearTiempo(segundos) {
        if (!Number.isFinite(segundos)) return "0:00";

        const minutos = Math.floor(segundos / 60);
        const resto = Math.floor(segundos % 60)
          .toString()
          .padStart(2, "0");

        return `${minutos}:${resto}`;
      }

      function actualizarProgreso() {
        const duracion = audioMesa.duration || 0;
        const actual = audioMesa.currentTime || 0;
        const porcentaje = duracion ? (actual / duracion) * 100 : 0;

        progressRange.value = porcentaje;
        currentTimeEl.textContent = formatearTiempo(actual);
        durationTimeEl.textContent = formatearTiempo(duracion);
      }

      function resetearProgreso() {
        progressRange.value = 0;
        currentTimeEl.textContent = "0:00";
        durationTimeEl.textContent = "0:00";
      }

      function abrirBaseCanciones() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_CANCIONES, DB_VERSION);

          request.onupgradeneeded = () => {
            request.result.createObjectStore(STORE_CANCIONES, {
              keyPath: "id",
            });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function leerCancionesGuardadas(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_CANCIONES, "readonly");
          const request = tx.objectStore(STORE_CANCIONES).getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      function guardarCancionUsuario(db, cancion) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_CANCIONES, "readwrite");
          const request = tx.objectStore(STORE_CANCIONES).put(cancion);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      async function cargarCancionesUsuario() {
        try {
          const db = await abrirBaseCanciones();
          cancionesUsuario = (await leerCancionesGuardadas(db)).sort((a, b) =>
            a.titulo.localeCompare(b.titulo),
          );
          db.close();
        } catch {
          cancionesUsuario = [];
        }

        actualizarEstadoCanciones();
      }

      function actualizarEstadoCanciones() {
        const extra = cancionesUsuario.length;
        songLoaderStatus.textContent = extra
          ? `${extra} añadidas`
          : "Carpeta canciones";
      }

      async function anadirCancionesSeleccionadas(evento) {
        const archivos = [...evento.target.files].filter((archivo) =>
          /\.mp3$/i.test(archivo.name),
        );

        if (!archivos.length) return;

        songLoaderStatus.textContent = "Guardando...";

        try {
          const db = await abrirBaseCanciones();

          for (const archivo of archivos) {
            await guardarCancionUsuario(db, {
              id: `subida/${archivo.name}`,
              titulo: limpiarNombreCancion(archivo.name),
              blob: archivo,
            });
          }

          db.close();
          await cargarCancionesUsuario();
          prepararColaCanciones(cancionActual?.ruta || "");
        } catch {
          songLoaderStatus.textContent = "No se pudo guardar";
        } finally {
          evento.target.value = "";
        }
      }

      function obtenerTodasLasCanciones() {
        const cancionesCarpeta = CANCIONES.map((ruta) => ({
          ruta,
          titulo: limpiarNombreCancion(ruta),
        }));

        const cancionesAnadidas = cancionesUsuario.map((cancion) => ({
          ruta: cancion.id,
          titulo: cancion.titulo,
          blob: cancion.blob,
        }));

        return [...cancionesCarpeta, ...cancionesAnadidas];
      }

      function mezclar(lista) {
        const copia = [...lista];

        for (let i = copia.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copia[i], copia[j]] = [copia[j], copia[i]];
        }

        return copia;
      }

      function leerCancionesUsadas() {
        try {
          const guardadas = JSON.parse(
            localStorage.getItem(CLAVE_CANCIONES_USADAS) || "[]",
          );

          return Array.isArray(guardadas) ? guardadas : [];
        } catch {
          return [];
        }
      }

      function guardarCancionesUsadas(rutas) {
        try {
          localStorage.setItem(CLAVE_CANCIONES_USADAS, JSON.stringify(rutas));
        } catch {}
      }

      function marcarCancionUsada(ruta) {
        const todas = obtenerTodasLasCanciones().map((cancion) => cancion.ruta);
        const usadas = leerCancionesUsadas().filter((usada) =>
          todas.includes(usada),
        );

        if (!usadas.includes(ruta)) {
          usadas.push(ruta);
        }

        guardarCancionesUsadas(usadas);
      }

      function prepararColaCanciones(excluirRuta = "") {
        const todas = obtenerTodasLasCanciones();
        const rutasValidas = todas.map((cancion) => cancion.ruta);
        let usadas = leerCancionesUsadas().filter((ruta) =>
          rutasValidas.includes(ruta),
        );

        let disponibles = todas.filter(
          (cancion) =>
            !usadas.includes(cancion.ruta) && cancion.ruta !== excluirRuta,
        );

        if (!disponibles.length) {
          usadas = excluirRuta ? [excluirRuta] : [];
          guardarCancionesUsadas(usadas);
          disponibles = todas.filter((cancion) => cancion.ruta !== excluirRuta);
        }

        colaCanciones = mezclar(disponibles);
        indiceCancion = -1;
      }

      function detenerMusica() {
        sesionAudio++;
        cancionActual = null;
        colaCanciones = [];
        indiceCancion = -1;
        fraseMesaActual = "";
        pausaInterna = true;
        audioMesa.pause();
        if (urlCancionTemporal) {
          URL.revokeObjectURL(urlCancionTemporal);
          urlCancionTemporal = "";
        }
        audioMesa.removeAttribute("src");
        audioMesa.load();
        pausaInterna = false;
        resetearProgreso();
        ocultarPlayer();
      }

      function musicaEstaSonando() {
        return Boolean(cancionActual && !audioMesa.paused && !audioMesa.ended);
      }

      function detenerSorteo() {
        audioSorteo.pause();
        audioSorteo.currentTime = 0;
      }

      function reproducirSonidoSorteo() {
        return;
      }

      function desbloquearAudio() {
        return;
      }

      function actualizarPlayer(cancion = null) {
        const total = obtenerTodasLasCanciones().length;

        if (!cancion || !total) {
          ocultarPlayer();
          return;
        }

        player.classList.add("show");
        playerKicker.textContent = `Playlist continua · ${total} canciones`;
        playerTitle.textContent = cancion.titulo;
        prevBtn.disabled = indiceCancion <= 0;
        nextBtn.disabled = total <= 1;
        playBtn.textContent = audioMesa.paused ? "▶" : "❚❚";
      }

      function ocultarPlayer() {
        player.classList.remove("show");
        playerTitle.textContent = "Sin musica todavia";
        playerKicker.textContent = "Playlist";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        playBtn.textContent = "▶";
      }

      function reproducirCancion(cancion, sesion) {
        if (!cancion) return;
        if (sesion && sesion !== sesionAudio) return;

        detenerSorteo();
        cancionActual = cancion;
        usuarioPausoMusica = false;
        pausaInterna = true;
        audioMesa.pause();
        if (urlCancionTemporal) {
          URL.revokeObjectURL(urlCancionTemporal);
          urlCancionTemporal = "";
        }
        if (cancion.blob) {
          urlCancionTemporal = URL.createObjectURL(cancion.blob);
          audioMesa.src = urlCancionTemporal;
        } else {
          audioMesa.src = encodeURI(cancion.ruta);
        }
        audioMesa.currentTime = 0;
        audioMesa.volume = 1;
        resetearProgreso();
        pausaInterna = false;
        audioMesa
          .play()
          .then(() => {
            marcarCancionUsada(cancion.ruta);
            actualizarPlayer(cancion);
          })
          .catch(() => {
            cancionActual = null;
            fraseAudioEl.textContent =
              "La tele ha bloqueado el sonido. Pulsa ASIGNAR MESA otra vez para activarlo.";
            fraseAudioEl.classList.add("show");
            audioDesbloqueado = false;
          });
      }

      function reproducirSiguienteCancion() {
        sesionAudio++;

        if (
          !colaCanciones.length ||
          indiceCancion >= colaCanciones.length - 1
        ) {
          prepararColaCanciones(cancionActual?.ruta || "");
        }

        indiceCancion++;
        const cancion = colaCanciones[indiceCancion];

        reproducirCancion(cancion, sesionAudio);
      }

      function cancionSiguienteManual() {
        reproducirSiguienteCancion();
      }

      function cancionAnterior() {
        if (!cancionActual) return;

        if (audioMesa.currentTime > 3) {
          audioMesa.currentTime = 0;
          actualizarProgreso();
          return;
        }

        if (indiceCancion <= 0) return;

        sesionAudio++;
        indiceCancion--;
        const cancion = colaCanciones[indiceCancion];

        reproducirCancion(cancion, sesionAudio);
      }

      function alternarPlay() {
        if (!cancionActual || !audioMesa.src) return;

        if (audioMesa.paused) {
          usuarioPausoMusica = false;
          audioMesa
            .play()
            .then(() => {
              playBtn.textContent = "❚❚";
            })
            .catch(() => {});
        } else {
          usuarioPausoMusica = true;
          audioMesa.pause();
          playBtn.textContent = "▶";
        }
      }

      function asegurarMusicaActiva() {
        if (!cancionActual) return;
        if (!audioMesa.src) return;
        if (audioMesa.ended) return;
        if (!audioMesa.paused) return;
        if (usuarioPausoMusica || pausaInterna || protegiendoMusica) return;

        protegiendoMusica = true;

        setTimeout(() => {
          if (
            cancionActual &&
            audioMesa.src &&
            audioMesa.paused &&
            !audioMesa.ended &&
            !usuarioPausoMusica &&
            !pausaInterna
          ) {
            audioMesa.play().catch(() => {});
          }

          protegiendoMusica = false;
        }, 90);
      }

      function vigilarMusicaDuranteAsignacion() {
        asegurarMusicaActiva();
        setTimeout(asegurarMusicaActiva, 250);
        setTimeout(asegurarMusicaActiva, 700);
        setTimeout(asegurarMusicaActiva, 1350);
        setTimeout(asegurarMusicaActiva, 2100);
      }

      function formatearListaMesas(lista) {
        if (lista.length === 0) return "";
        if (lista.length === 1) return lista[0].toString();
        if (lista.length === 2) return lista[0] + " y " + lista[1];

        return lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1];
      }

      function obtenerFraseDinamica(numeroMesaQueSale) {
        const restantes = [...mesas].sort((a, b) => a - b);

        let bloque = null;

        if (restantes.length === 4) {
          bloque = frasesPorEstado.quedan4;
        } else if (restantes.length === 3) {
          bloque = frasesPorEstado.quedan3;
        } else if (restantes.length === 2) {
          bloque = frasesPorEstado.quedan2;
        } else if (restantes.length === 1) {
          bloque = frasesPorEstado.queda1;
        } else {
          bloque = frasesPorEstado.final;
        }

        let frase = elegirAleatorio(bloque);

        frase = frase
          .replaceAll("{salida}", numeroMesaQueSale)
          .replaceAll("{quedan}", formatearListaMesas(restantes))
          .replaceAll("{queda}", restantes[0] ?? "")
          .replaceAll("{primeraRestante}", restantes[0] ?? "")
          .replaceAll("{segundaRestante}", restantes[1] ?? "");

        return frase;
      }

      function escaparHtml(texto) {
        return texto.replace(/[&<>"']/g, (caracter) => {
          const entidades = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return entidades[caracter];
        });
      }

      function mostrarTexto(texto, cancion = null) {
        fraseAudioEl.classList.remove("show");

        setTimeout(() => {
          if (cancion) {
            const frase = escaparHtml(texto);

            fraseAudioEl.innerHTML = `
              <span class="frase-linea">${frase}</span>
            `;
          } else {
            fraseAudioEl.textContent = texto;
          }

          fraseAudioEl.classList.add("show");
        }, 80);
      }

      function confetiSuave() {
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("div");

          s.className = "spark";

          const x = window.innerWidth / 2 + (Math.random() * 320 - 160);

          const y = window.innerHeight / 2 + (Math.random() * 80 - 40);

          s.style.left = x + "px";
          s.style.top = y + "px";

          document.body.appendChild(s);

          setTimeout(() => s.remove(), 900);
        }
      }

      function animarTexto() {
        mesaEl.classList.remove("pop");

        void mesaEl.offsetWidth;

        mesaEl.classList.add("pop");

        confetiSuave();
      }

      function bloquearBotonAsignar() {
        asignandoMesa = true;
        btn.disabled = true;
        btn.textContent = "ASIGNANDO...";
      }

      function desbloquearBotonAsignar() {
        asignandoMesa = false;
        btn.disabled = false;
        btn.textContent = "ASIGNAR MESA";
        clearTimeout(cuentaTimer);
        cuentaTimer = null;
      }

      function mostrarCuentaAtras(valor) {
        cuentaEl.textContent = valor;
        cuentaEl.classList.add("show");
        cuentaEl.classList.remove("pop");

        void cuentaEl.offsetWidth;

        cuentaEl.classList.add("pop");
      }

      function iniciarAsignacionMesa() {
        if (asignandoMesa) return;

        bloquearBotonAsignar();

        msgEl.textContent = "Asignando mesa...";
        msgEl.removeAttribute("style");

        fraseAudioEl.textContent = "";
        fraseAudioEl.classList.remove("show");

        dice.classList.add("rolling");
        reproducirSonidoSorteo();
        vigilarMusicaDuranteAsignacion();

        const pasos = ["3", "2", "1", "🎲"];
        let indicePaso = 0;

        mostrarCuentaAtras(pasos[indicePaso]);

        function siguientePaso() {
          indicePaso++;

          if (indicePaso < pasos.length) {
            mostrarCuentaAtras(pasos[indicePaso]);
            cuentaTimer = setTimeout(siguientePaso, 650);
            return;
          }

          cuentaEl.classList.remove("show", "pop");
          cuentaEl.textContent = "";

          sacarMesaConfirmada();
        }

        cuentaTimer = setTimeout(siguientePaso, 650);
      }

      function sacarMesaConfirmada() {
        if (mesas.length === 0) {
          desbloquearBotonAsignar();
          overlay.classList.add("show");
          return;
        }

        detenerSorteo();

        const index = Math.floor(Math.random() * mesas.length);

        const numero = mesas[index];

        mesas.splice(index, 1);

        dice.classList.remove("rolling");

        setTimeout(() => {
          dice.style.transform =
            posicionesDado[numero] +
            " rotateZ(" +
            Math.floor(Math.random() * 4) * 360 +
            "deg)";
        }, 40);

        setTimeout(() => {
          const frase = obtenerFraseDinamica(numero);
          fraseMesaActual = frase;

          mesaEl.textContent = "MESA " + numero;

          msgEl.textContent = "MESA ASIGNADA";
          msgEl.removeAttribute("style");

          mostrarTexto(fraseMesaActual);

          if (!cancionActual) {
            reproducirSiguienteCancion();
          }

          actualizarRestantes();

          animarTexto();

          desbloquearBotonAsignar();
        }, 1250);
      }

      function tap() {
        window.scrollTo(0, 0);
        desbloquearAudio();

        if (asignandoMesa) return;

        if (mesas.length === 0) {
          overlay.classList.add("show");
          return;
        }

        iniciarAsignacionMesa();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
        }
      });

      audioMesa.addEventListener("ended", reproducirSiguienteCancion);
      audioMesa.addEventListener("loadedmetadata", actualizarProgreso);
      audioMesa.addEventListener("timeupdate", actualizarProgreso);
      audioMesa.addEventListener("play", () => {
        playBtn.textContent = "❚❚";
      });
      audioMesa.addEventListener("pause", () => {
        playBtn.textContent = "▶";
        asegurarMusicaActiva();
      });
      progressRange.addEventListener("input", () => {
        if (!audioMesa.duration) return;

        audioMesa.currentTime =
          (Number(progressRange.value) / 100) * audioMesa.duration;
        actualizarProgreso();
      });
      songFiles.addEventListener("change", anadirCancionesSeleccionadas);

      cargarCancionesUsuario().then(reiniciar);
    </script>
  </body>
</html>
